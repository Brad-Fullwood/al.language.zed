[workspace]
members = ["crates/*"]
exclude = ["crates/.zed", "tree-sitter-al/generator"]
resolver = "2"

# The root package is the Zed WASM extension
[package]
name = "zed-al"
version = "0.2.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# ⚠️ API CHANNEL — READ BEFORE CHANGING.
# The COMMITTED state must always pin a RELEASED zed_extension_api (crates.io
# version, currently 0.7.0). Released APIs load on ALL Zed channels (Stable,
# Preview, Dev, Nightly) and are required by the extension registry. A git/main
# pin is an UNRELEASED API: it loads only on Dev/Nightly Zed and SILENTLY FAILS
# on Stable ("unreleased versions of the extension API can only be used on
# development builds of Zed") — that trap shipped four times before the
# `committed_api_target_is_released` guard test was added. For local experiments
# against git main use `scripts/use-api.sh dev`, and run
# `scripts/use-api.sh stable` before committing.
zed_extension_api = "0.7.0"
serde_json = "1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
dashmap = "6"
ropey = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# rustls (not the default native-tls) so the dep tree has no system-OpenSSL
# build requirement — native-tls -> openssl-sys fails to cross-compile to
# aarch64-linux in the release pipeline. rustls is pure-Rust + vendored.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }
zip = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
petgraph = "0.7"
futures = "0.3"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
