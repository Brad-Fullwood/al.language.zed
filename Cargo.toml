[workspace]
members = ["crates/*"]
# tree-sitter-al is a git submodule with its own release cadence (a standalone,
# publishable `tree-sitter-al` crate); it is consumed as a path dependency, not
# absorbed as a workspace member.
exclude = ["crates/.zed", "tree-sitter-al", "tree-sitter-al/generator"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Brad-Fullwood/al.language.zed"
# The root package is the Zed WASM extension
[package]
name = "zed-al"
version = "0.2.2"
edition.workspace = true
license.workspace = true
publish = false
# Detects the resolved zed_extension_api version and enables the
# `zed_api_0_8` cfg on 0.8.0+, so the settings-schema methods in src/lib.rs
# compile in/out with no source edit. See build.rs.
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The registry requires a released API. Git revisions load only in Zed
# Dev/Nightly; use scripts/use-api.sh for local API experiments.
zed_extension_api = "0.7.0"
serde_json = "1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
# preserve_order: serde_json::Map keeps insertion order (IndexMap) so the native
# `.app` emitter can reproduce alc's exact JSON key ordering byte-for-byte.
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
dashmap = "6"
ropey = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# rustls (not the default native-tls) so the dep tree has no system-OpenSSL
# build requirement — native-tls -> openssl-sys fails to cross-compile to
# aarch64-linux in the release pipeline. rustls is pure-Rust + vendored.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }
zip = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
petgraph = "0.7"
futures = "0.3"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
# Exact 96-bit decimal matching BC's System.Decimal. Pure-Rust, no NaN /
# no binary-float drift; `maths` adds pow/round helpers used by the interpreter.
rust_decimal = { version = "1", default-features = false, features = ["std", "maths"] }
# `dec!(…)` literal macro — dev/test ergonomics only.
rust_decimal_macros = "1"
