[workspace]
members = ["crates/*"]
exclude = ["crates/.zed", "tree-sitter-al/generator"]
resolver = "2"

# The root package is the Zed WASM extension
[package]
name = "zed-al"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# ⚠️ CHANNEL COUPLING — READ BEFORE CHANGING.
# This targets the UNRELEASED extension API (git main / [lib] version 0.8.0 in
# extension.toml). Zed only loads unreleased-API extensions on the Dev or
# Nightly release channels (crates/extension_host/.../wasm_host/wit.rs:
# `ReleaseChannel::Dev | ReleaseChannel::Nightly => latest::MAX_VERSION`).
# On Stable or Preview Zed the extension SILENTLY FAILS TO LOAD with:
#   "unreleased versions of the extension API can only be used on development builds of Zed"
# and al-lsp never spawns. If you must run on Stable Zed, downgrade to the latest
# RELEASED api (currently 0.7.0) — see scripts/use-api.sh and TROUBLESHOOTING.md.
zed_extension_api = { git = "https://github.com/zed-industries/zed", branch = "main" }
serde_json = "1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
dashmap = "6"
ropey = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json", "multipart"] }
zip = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
petgraph = "0.7"
futures = "0.3"
getrandom = "0.2"
