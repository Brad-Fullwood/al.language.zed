name: Property tests (deep)

# The property tests run on every PR inside the workspace `cargo test` at their
# default budget (128 cases, 32 in al-emit). That finds shallow failures; one of
# the four bugs they have found so far needed about 1,000 cases. This run gives
# them 8,192 cases and room to shrink, once a night and on demand.
#
# A failure uploads the `*.proptest-regressions` files it wrote. Commit them:
# proptest replays a persisted case before the random ones, so the per-PR run
# then checks that exact input every time.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PROPTEST_CASES: 8192
  PROPTEST_MAX_SHRINK_ITERS: 4096

permissions:
  contents: read

jobs:
  property-tests:
    name: Property tests (8192 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-proptest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-proptest-
            ${{ runner.os }}-cargo-

      # One step per crate with --no-fail-fast, so a failure in one does not
      # hide the others.
      - name: al-syntax
        if: always()
        run: cargo test -p al-syntax --no-fail-fast --test property_formatting --test property_sort_members
      - name: al-source
        if: always()
        run: cargo test -p al-source --no-fail-fast --test property_positions
      - name: al-runtime
        if: always()
        run: cargo test -p al-runtime --no-fail-fast --test property_filter --test property_round --test property_record_model
      - name: al-symbols
        if: always()
        run: cargo test -p al-symbols --no-fail-fast --test property_app_reader
      - name: al-emit
        if: always()
        run: cargo test -p al-emit --no-fail-fast --test property_roundtrip

      - name: Upload new regression seeds
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-regressions
          path: crates/**/*.proptest-regressions
          if-no-files-found: ignore
