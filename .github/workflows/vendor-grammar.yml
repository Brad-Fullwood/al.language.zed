name: Vendor grammar snapshot

# Some restricted development environments cannot clone the grammar submodule.
# This workflow publishes a matching snapshot on `grammar-vendor` for
# `scripts/fetch-grammar.sh`; VENDORED_FROM_REV records the source revision.

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - '.gitmodules'
      - 'tree-sitter-al'
      - '.github/workflows/vendor-grammar.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Push snapshot to grammar-vendor branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REV=$(git -C tree-sitter-al rev-parse HEAD)
          TMP=$(mktemp -d)
          rsync -a --exclude='.git' tree-sitter-al/ "$TMP/"
          echo "$REV" > "$TMP/VENDORED_FROM_REV"
          cd "$TMP"
          git init -q -b grammar-vendor
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vendored tree-sitter-al snapshot at ${REV}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" grammar-vendor
