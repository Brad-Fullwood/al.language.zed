name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default to read-only across all scopes; jobs that need write
# (create-release) opt in explicitly.
permissions:
  contents: read
  actions: read

jobs:
  release-preflight:
    name: Release hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Check repository slug consistency
        run: ./scripts/check-repo-consistency.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable

      - name: Check release hygiene
        run: ./scripts/check-release-hygiene.sh --tag "${GITHUB_REF_NAME}" --changed-since auto --require-ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TIMEOUT_SECONDS: "3600"
          CI_POLL_SECONDS: "30"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-x86_64

          # Linux aarch64 (cross-compiled)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-aarch64
            cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name: macos-x86_64

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: macos-aarch64

          # Windows x86_64 — both binaries are native. The daemon uses a named
          # pipe here (Unix-domain sockets remain in use on Linux/macOS).
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name: windows-x86_64
            windows: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # The semantic feature builds AlBridge.dll with the .NET SDK.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Release al-lsp builds include the semantic bridge.
      - name: Build al-lsp binary (native)
        if: "!matrix.cross"
        run: cargo build -p al-lsp --bin al-lsp --release --features semantic --target ${{ matrix.target }}

      - name: Build al-explorer binary (native)
        if: "!matrix.cross"
        run: cargo build -p al-explorer --release --target ${{ matrix.target }}

      # Build the platform-independent bridge on the host for the cross image.
      - name: Pre-build semantic bridge on host (cross)
        if: matrix.cross
        run: dotnet build crates/al-semantic/bridge/AlBridge.csproj -c Release --nologo -o "$GITHUB_WORKSPACE/prebuilt-bridge"

      - name: Build al-lsp binary (cross)
        if: matrix.cross
        env:
          AL_BRIDGE_PREBUILT: ${{ github.workspace }}/prebuilt-bridge
          CROSS_CONTAINER_OPTS: "-e AL_BRIDGE_PREBUILT=/project/prebuilt-bridge"
        run: cross build -p al-lsp --bin al-lsp --release --features semantic --target ${{ matrix.target }}

      - name: Build al-explorer binary (cross)
        if: matrix.cross
        run: cross build -p al-explorer --release --target ${{ matrix.target }}

      # Keep binaries at the archive root for extension binary resolution.
      - name: Package artifacts (Unix)
        if: "!matrix.windows"
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          OUT="al-${{ matrix.artifact_name }}"
          STAGE="$(mktemp -d)"
          cp "$BIN_DIR/al-lsp" "$BIN_DIR/al-explorer" "$STAGE/"
          BRIDGE_SRC="$(find "$BIN_DIR/build" -type d -path '*/out/bridge' | head -n1)"
          if [ -z "$BRIDGE_SRC" ] || [ ! -f "$BRIDGE_SRC/AlBridge.dll" ]; then
            echo "::error::semantic bridge (AlBridge.dll) not found under $BIN_DIR/build — al-lsp would ship without semantic analysis"
            exit 1
          fi
          mkdir -p "$STAGE/bridge"
          cp "$BRIDGE_SRC"/AlBridge.dll "$BRIDGE_SRC"/AlBridge.runtimeconfig.json "$STAGE/bridge/"
          cp "$BRIDGE_SRC"/*.dll "$STAGE/bridge/" 2>/dev/null || true
          tar -czf "$OUT.tar.gz" -C "$STAGE" .
          # Digests of the executables INSIDE the archive, keyed
          # <archive>/<binary>. The extension checks these after extraction:
          # download_file unpacks a .tar.gz and does not keep the archive, and
          # the 0.7 extension API cannot unpack a local file, so the archive
          # digests in checksums.txt are unreachable on that path. These cover
          # the bytes that actually get executed. See
          # AlExtension::verify_extracted_binaries in src/lib.rs.
          ( cd "$STAGE" && sha256sum al-lsp al-explorer ) \
            | sed "s|  |  $OUT.tar.gz/|" > "$OUT.binaries.sha256"
          cat "$OUT.binaries.sha256"

      - name: Upload binary artifact (Unix)
        if: "!matrix.windows"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: al-${{ matrix.artifact_name }}
          path: |
            al-${{ matrix.artifact_name }}.tar.gz
            al-${{ matrix.artifact_name }}.binaries.sha256

      # Keep binaries at the archive root for extension binary resolution.
      - name: Package artifact (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          $binDir = "target/${{ matrix.target }}/release"
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "stage") -Force
          Copy-Item "$binDir/al-lsp.exe" $stage
          Copy-Item "$binDir/al-explorer.exe" $stage
          $bridgeSrc = Get-ChildItem -Path "$binDir/build" -Recurse -Directory -Filter bridge |
            Where-Object { Test-Path (Join-Path $_.FullName 'AlBridge.dll') } | Select-Object -First 1
          if (-not $bridgeSrc) {
            Write-Error "semantic bridge (AlBridge.dll) not found under $binDir/build"
            exit 1
          }
          $bridgeDst = New-Item -ItemType Directory -Path (Join-Path $stage 'bridge') -Force
          Copy-Item (Join-Path $bridgeSrc.FullName '*.dll') $bridgeDst
          Copy-Item (Join-Path $bridgeSrc.FullName 'AlBridge.runtimeconfig.json') $bridgeDst
          $archive = "al-${{ matrix.artifact_name }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          # Same per-binary digests as the Unix leg; see the comment there.
          $lines = foreach ($name in 'al-lsp.exe', 'al-explorer.exe') {
            $hash = (Get-FileHash (Join-Path $stage $name) -Algorithm SHA256).Hash.ToLower()
            "$hash  $archive/$name"
          }
          $lines | Set-Content -Encoding ascii "al-${{ matrix.artifact_name }}.binaries.sha256"
          Get-Content "al-${{ matrix.artifact_name }}.binaries.sha256"

      - name: Upload binary artifact (Windows)
        if: matrix.windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: al-${{ matrix.artifact_name }}
          path: |
            al-${{ matrix.artifact_name }}.zip
            al-${{ matrix.artifact_name }}.binaries.sha256

  build-wasm:
    name: Build WASM extension
    needs: release-preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust stable + wasm32-wasip2
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-release-cargo-

      - name: Build zed-al WASM extension
        run: |
          cargo build -p zed-al --target wasm32-wasip2 --release
          scripts/check-zed-wasm-component.sh target/wasm32-wasip2/release/zed_al.wasm

      - name: Collect WASM artifact
        run: |
          mkdir -p extension-wasm
          cp target/wasm32-wasip2/release/zed_al.wasm extension-wasm/extension.wasm
          cp extension.toml extension-wasm/

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-wasm
          path: extension-wasm/

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: `id-token` mints the Sigstore signing certificate and
      # `attestations` records the statement against this repository.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: List collected artifacts
        run: find artifacts/ -type f | sort

      # Record archive AND extension-package checksums under the *released
      # asset* name. Each artifact downloads into its own `artifacts/<name>/`
      # directory, but the release uploads assets flat (basename only), so a
      # directory-prefixed path here would make `sha256sum -c checksums.txt`
      # fail for every entry after the user downloads the assets side by side.
      # extension.wasm/extension.toml are released assets too (see the `files:`
      # list below) and must be verifiable exactly like the platform archives.
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          : > checksums.txt
          find . \( -name '*.tar.gz' -o -name '*.zip' -o -name 'extension.wasm' -o -name 'extension.toml' \) -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' archive; do
                ( cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" )
              done >> checksums.txt
          cat checksums.txt
          # Asset names must be unique once flattened, or a checksum line would
          # be ambiguous about which archive it covers.
          if [ "$(cut -d' ' -f3- checksums.txt | sort | uniq -d | wc -l)" -ne 0 ]; then
            echo "::error::duplicate archive basenames across artifacts — flattened release assets would collide"
            exit 1
          fi

      # Collect the per-binary digests each build job produced. This is a
      # separate asset from checksums.txt so that file stays exactly
      # `sha256sum -c`-able for someone verifying a manual download; the
      # `<archive>/<binary>` keys here are not paths that exist after
      # extraction. The extension reads this one (see
      # AlExtension::verify_extracted_binaries in src/lib.rs): it cannot hash
      # the archive itself, because download_file extracts and discards it.
      - name: Collect per-binary checksums
        run: |
          cd artifacts
          find . -name '*.binaries.sha256' -type f -print0 \
            | sort -z \
            | xargs -0 cat > binary-checksums.txt
          cat binary-checksums.txt
          expected=$(find . \( -name '*.tar.gz' -o -name '*.zip' \) -type f | wc -l)
          covered=$(cut -d'/' -f1 binary-checksums.txt | sed 's/^[0-9a-f]*  *//' | sort -u | wc -l)
          if [ "$expected" -ne "$covered" ]; then
            echo "::error::binary-checksums.txt covers $covered of $expected platform archives — the extension would refuse to start from an uncovered one"
            exit 1
          fi

      # checksums.txt and binary-checksums.txt travel beside the archives on
      # the same release, so they show a download arrived intact and nothing
      # more. A build attestation is signed by Sigstore against this workflow's
      # identity, which is what `gh attestation verify --repo` checks, so it
      # says the bytes came out of this workflow rather than merely matching a
      # digest published next to them. Subjects come from checksums.txt, whose
      # names are already the flattened release asset names.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "AL Extension ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
            artifacts/binary-checksums.txt
            artifacts/extension-wasm/extension.wasm
            artifacts/extension-wasm/extension.toml
