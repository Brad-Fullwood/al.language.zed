name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-x86_64

          # Linux aarch64 (cross-compiled)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-aarch64
            cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name: macos-x86_64

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: macos-aarch64

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build al-lsp (native)
        if: "!matrix.cross"
        run: cargo build -p al-lsp --release --target ${{ matrix.target }}

      - name: Build al-cli (native)
        if: "!matrix.cross"
        run: cargo build -p al-cli --release --target ${{ matrix.target }}

      - name: Build al-explorer (native)
        if: "!matrix.cross"
        run: cargo build -p al-explorer --release --target ${{ matrix.target }}

      - name: Build al-lsp (cross)
        if: matrix.cross
        run: cross build -p al-lsp --release --target ${{ matrix.target }}

      - name: Build al-cli (cross)
        if: matrix.cross
        run: cross build -p al-cli --release --target ${{ matrix.target }}

      - name: Build al-explorer (cross)
        if: matrix.cross
        run: cross build -p al-explorer --release --target ${{ matrix.target }}

      # ── Package (Linux / macOS) ──────────────────────────────────────────────
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          OUT="al-${{ matrix.artifact_name }}"
          mkdir -p "$OUT"
          cp "$BIN_DIR/al-lsp"      "$OUT/"
          cp "$BIN_DIR/al"          "$OUT/"
          cp "$BIN_DIR/al-explorer" "$OUT/"
          tar -czf "$OUT.tar.gz" "$OUT"

      # ── Package (Windows) ───────────────────────────────────────────────────
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BIN_DIR = "target\${{ matrix.target }}\release"
          $OUT     = "al-${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Path $OUT
          Copy-Item "$BIN_DIR\al-lsp.exe"      $OUT\
          Copy-Item "$BIN_DIR\al.exe"           $OUT\
          Copy-Item "$BIN_DIR\al-explorer.exe"  $OUT\
          Compress-Archive -Path $OUT -DestinationPath "$OUT.zip"

      - name: Upload binary artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: al-${{ matrix.artifact_name }}
          path: al-${{ matrix.artifact_name }}.tar.gz

      - name: Upload binary artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: al-${{ matrix.artifact_name }}
          path: al-${{ matrix.artifact_name }}.zip

  build-wasm:
    name: Build WASM extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable + wasm32-wasip1
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-release-cargo-

      - name: Build zed-al WASM extension
        run: cargo build -p zed-al --target wasm32-wasip1 --release

      - name: Collect WASM artifact
        run: |
          mkdir -p extension-wasm
          cp target/wasm32-wasip1/release/zed_al.wasm extension-wasm/extension.wasm
          cp extension.toml extension-wasm/

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-wasm
          path: extension-wasm/

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List collected artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "AL Extension ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/extension-wasm/extension.wasm
            artifacts/extension-wasm/extension.toml
