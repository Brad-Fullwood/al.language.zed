name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default to read-only across all scopes; jobs that need write
# (create-release) opt in explicitly.
permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-x86_64

          # Linux aarch64 (cross-compiled)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-aarch64
            cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name: macos-x86_64

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: macos-aarch64

          # Windows x86_64 — builds ONLY the al-lsp binary. al-explorer's
          # daemon IPC is an AF_UNIX socket (see F-020/F-021) and does not
          # compile on Windows, but al-lsp itself is portable: its LSP
          # (--stdio) and DAP (--dap) modes use platform-neutral stdio, and the
          # Unix-only daemon transport is behind `#[cfg(unix)]` with a stub on
          # Windows. This is what Zed actually spawns, so shipping it unblocks
          # Windows users (ecosystem-roadmap.md item 8 / strategic bet 3b).
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name: windows-x86_64
            windows: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@56b2e01659f10f03a3269e9a59e022a20813df23 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --version 0.2.5

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Post-consolidation crate names: al-lsp is now [[bin]] inside al-core,
      # and al-cli was folded into al-explorer (see CLAUDE.md architecture
      # note). Build via -p al-core / -p al-explorer with explicit --bin.
      #
      # al-lsp is built on EVERY target (it is what Zed spawns). al-explorer is
      # built only on Unix targets — its daemon IPC client is AF_UNIX-only and
      # does not compile on Windows.
      - name: Build al-lsp binary (native)
        if: "!matrix.cross"
        run: cargo build -p al-core --bin al-lsp --release --target ${{ matrix.target }}

      - name: Build al-explorer binary (native, Unix only)
        if: "!matrix.cross && !matrix.windows"
        run: cargo build -p al-explorer --release --target ${{ matrix.target }}

      - name: Build al-lsp binary (cross)
        if: matrix.cross
        run: cross build -p al-core --bin al-lsp --release --target ${{ matrix.target }}

      - name: Build al-explorer binary (cross)
        if: matrix.cross
        run: cross build -p al-explorer --release --target ${{ matrix.target }}

      # ── Package (Linux / macOS) ──────────────────────────────────────────────
      # Binaries are placed at the ARCHIVE ROOT (no wrapping directory) so the
      # extension finds `al-lsp` at `<extract-dir>/al-lsp` — this matches the
      # `binary_path` the WASM extension constructs in src/lib.rs.
      - name: Package artifacts (Unix)
        if: "!matrix.windows"
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          OUT="al-${{ matrix.artifact_name }}"
          tar -czf "$OUT.tar.gz" -C "$BIN_DIR" al-lsp al-explorer

      - name: Upload binary artifact (Unix)
        if: "!matrix.windows"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: al-${{ matrix.artifact_name }}
          path: al-${{ matrix.artifact_name }}.tar.gz

      # ── Package (Windows) ─────────────────────────────────────────────────────
      # Ships ONLY al-lsp.exe (no al-explorer). Zipped with the binary at the
      # archive root so it extracts to `<extract-dir>/al-lsp.exe`, matching the
      # `binary_path` in src/lib.rs. Asset name: al-windows-x86_64.zip.
      - name: Package artifact (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/al-lsp.exe"
          Compress-Archive -Path $bin -DestinationPath "al-${{ matrix.artifact_name }}.zip"

      - name: Upload binary artifact (Windows)
        if: matrix.windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: al-${{ matrix.artifact_name }}
          path: al-${{ matrix.artifact_name }}.zip

  build-wasm:
    name: Build WASM extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable + wasm32-wasip1
        uses: dtolnay/rust-toolchain@56b2e01659f10f03a3269e9a59e022a20813df23 # stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-release-cargo-

      - name: Build zed-al WASM extension
        run: cargo build -p zed-al --target wasm32-wasip1 --release

      - name: Collect WASM artifact
        run: |
          mkdir -p extension-wasm
          cp target/wasm32-wasip1/release/zed_al.wasm extension-wasm/extension.wasm
          cp extension.toml extension-wasm/

      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-wasm
          path: extension-wasm/

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts/

      - name: List collected artifacts
        run: find artifacts/ -type f | sort

      # Emit a single checksums.txt covering every release binary archive so
      # that manual installers (and any future automated SHA verification on
      # the extension's download path) can verify integrity. Names are made
      # relative to the artifacts dir so the file lists `al-<os>-<arch>.<ext>`.
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . \( -name '*.tar.gz' -o -name '*.zip' \) -type f \
            | sed 's|^\./||' \
            | sort \
            | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          name: "AL Extension ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
            artifacts/extension-wasm/extension.wasm
            artifacts/extension-wasm/extension.toml
