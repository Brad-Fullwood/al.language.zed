name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default to read-only across all scopes; jobs that need write
# (create-release) opt in explicitly.
permissions:
  contents: read
  actions: read

jobs:
  release-preflight:
    name: Release hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check repository slug consistency
        run: ./scripts/check-repo-consistency.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check release hygiene
        run: ./scripts/check-release-hygiene.sh --tag "${GITHUB_REF_NAME}" --changed-since auto --require-ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TIMEOUT_SECONDS: "3600"
          CI_POLL_SECONDS: "30"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-x86_64

          # Linux aarch64 (cross-compiled)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: linux-aarch64
            cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name: macos-x86_64

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: macos-aarch64

          # Windows x86_64 — builds ONLY the al-lsp binary. al-explorer's
          # daemon IPC is an AF_UNIX socket (see F-020/F-021) and does not
          # compile on Windows, but al-lsp itself is portable: its LSP
          # (--stdio) and DAP (--dap) modes use platform-neutral stdio, and the
          # Unix-only daemon transport is behind `#[cfg(unix)]` with a stub on
          # Windows. This is what Zed actually spawns, so shipping it unblocks
          # Windows users (ecosystem-roadmap.md item 8 / strategic bet 3b).
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name: windows-x86_64
            windows: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The semantic bridge (built with --features semantic) needs the .NET SDK:
      # build.rs runs `dotnet build` to produce AlBridge.dll, and the toolchain
      # is required to compile the C# bridge. The CLR runtime is NOT needed at
      # build time (netcorehost downloads libnethost via `nethost-download`).
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --version 0.2.5

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # Post-consolidation crate names: al-lsp is now [[bin]] inside al-core,
      # and al-cli was folded into al-explorer (see CLAUDE.md architecture
      # note). Build via -p al-core / -p al-explorer with explicit --bin.
      #
      # al-lsp is built on EVERY target (it is what Zed spawns). al-explorer is
      # built only on Unix targets — its daemon IPC client is AF_UNIX-only and
      # does not compile on Windows.
      # al-lsp is built with --features semantic so the shipped binary contains
      # the real in-process .NET CLR host (not the no-op stub). build.rs runs
      # `dotnet build` to produce AlBridge.dll alongside it; that DLL is
      # platform-agnostic .NET IL and is bundled into every archive below so the
      # runtime finds it at <exe-dir>/bridge/ on the user's machine.
      - name: Build al-lsp binary (native)
        if: "!matrix.cross"
        run: cargo build -p al-core --bin al-lsp --release --features semantic --target ${{ matrix.target }}

      - name: Build al-explorer binary (native, Unix only)
        if: "!matrix.cross && !matrix.windows"
        run: cargo build -p al-explorer --release --target ${{ matrix.target }}

      # For the cross (aarch64) build the bridge DLL cannot be produced inside
      # the cross Docker image (no dotnet there), but it is platform-agnostic IL,
      # so build it on the host first, then point build.rs at it via
      # AL_BRIDGE_PREBUILT so it skips the in-container `dotnet build`.
      - name: Pre-build semantic bridge on host (cross)
        if: matrix.cross
        run: dotnet build crates/al-core/bridge/AlBridge.csproj -c Release --nologo -o "$GITHUB_WORKSPACE/prebuilt-bridge"

      - name: Build al-lsp binary (cross)
        if: matrix.cross
        env:
          AL_BRIDGE_PREBUILT: ${{ github.workspace }}/prebuilt-bridge
          CROSS_CONTAINER_OPTS: "-e AL_BRIDGE_PREBUILT=/project/prebuilt-bridge"
        run: cross build -p al-core --bin al-lsp --release --features semantic --target ${{ matrix.target }}

      - name: Build al-explorer binary (cross)
        if: matrix.cross
        run: cross build -p al-explorer --release --target ${{ matrix.target }}

      # ── Package (Linux / macOS) ──────────────────────────────────────────────
      # Binaries are placed at the ARCHIVE ROOT (no wrapping directory) so the
      # extension finds `al-lsp` at `<extract-dir>/al-lsp` — this matches the
      # `binary_path` the WASM extension constructs in src/lib.rs.
      - name: Package artifacts (Unix)
        if: "!matrix.windows"
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          OUT="al-${{ matrix.artifact_name }}"
          # Stage the binaries plus the semantic bridge so the archive root holds
          # `al-lsp`, `al-explorer`, and `bridge/AlBridge.dll` (+ runtimeconfig).
          # The runtime finds the bridge at <exe-dir>/bridge/ (host.rs Strategy 2).
          STAGE="$(mktemp -d)"
          cp "$BIN_DIR/al-lsp" "$BIN_DIR/al-explorer" "$STAGE/"
          BRIDGE_SRC="$(find "$BIN_DIR/build" -type d -path '*/out/bridge' | head -n1)"
          if [ -z "$BRIDGE_SRC" ] || [ ! -f "$BRIDGE_SRC/AlBridge.dll" ]; then
            echo "::error::semantic bridge (AlBridge.dll) not found under $BIN_DIR/build — al-lsp would ship without semantic analysis"
            exit 1
          fi
          mkdir -p "$STAGE/bridge"
          cp "$BRIDGE_SRC"/AlBridge.dll "$BRIDGE_SRC"/AlBridge.runtimeconfig.json "$STAGE/bridge/"
          # Include any bridge dependency DLLs the build emitted.
          cp "$BRIDGE_SRC"/*.dll "$STAGE/bridge/" 2>/dev/null || true
          tar -czf "$OUT.tar.gz" -C "$STAGE" .

      - name: Upload binary artifact (Unix)
        if: "!matrix.windows"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: al-${{ matrix.artifact_name }}
          path: al-${{ matrix.artifact_name }}.tar.gz

      # ── Package (Windows) ─────────────────────────────────────────────────────
      # Ships ONLY al-lsp.exe (no al-explorer). Zipped with the binary at the
      # archive root so it extracts to `<extract-dir>/al-lsp.exe`, matching the
      # `binary_path` in src/lib.rs. Asset name: al-windows-x86_64.zip.
      - name: Package artifact (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          $binDir = "target/${{ matrix.target }}/release"
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "stage") -Force
          Copy-Item "$binDir/al-lsp.exe" $stage
          # Bundle the platform-agnostic semantic bridge so al-lsp.exe finds it
          # at <exe-dir>\bridge\ on the user's machine (host.rs Strategy 2).
          $bridgeSrc = Get-ChildItem -Path "$binDir/build" -Recurse -Directory -Filter bridge |
            Where-Object { Test-Path (Join-Path $_.FullName 'AlBridge.dll') } | Select-Object -First 1
          if (-not $bridgeSrc) {
            Write-Error "semantic bridge (AlBridge.dll) not found under $binDir/build"
            exit 1
          }
          $bridgeDst = New-Item -ItemType Directory -Path (Join-Path $stage 'bridge') -Force
          Copy-Item (Join-Path $bridgeSrc.FullName '*.dll') $bridgeDst
          Copy-Item (Join-Path $bridgeSrc.FullName 'AlBridge.runtimeconfig.json') $bridgeDst
          Compress-Archive -Path "$stage/*" -DestinationPath "al-${{ matrix.artifact_name }}.zip"

      - name: Upload binary artifact (Windows)
        if: matrix.windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: al-${{ matrix.artifact_name }}
          path: al-${{ matrix.artifact_name }}.zip

  build-wasm:
    name: Build WASM extension
    needs: release-preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable + wasm32-wasip1
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-release-cargo-

      - name: Build zed-al WASM extension
        run: cargo build -p zed-al --target wasm32-wasip1 --release

      - name: Collect WASM artifact
        run: |
          mkdir -p extension-wasm
          cp target/wasm32-wasip1/release/zed_al.wasm extension-wasm/extension.wasm
          cp extension.toml extension-wasm/

      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-wasm
          path: extension-wasm/

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts/

      - name: List collected artifacts
        run: find artifacts/ -type f | sort

      # Emit a single checksums.txt covering every release binary archive so
      # that manual installers (and any future automated SHA verification on
      # the extension's download path) can verify integrity. Names are made
      # relative to the artifacts dir so the file lists `al-<os>-<arch>.<ext>`.
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . \( -name '*.tar.gz' -o -name '*.zip' \) -type f \
            | sed 's|^\./||' \
            | sort \
            | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          name: "AL Extension ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
            artifacts/extension-wasm/extension.wasm
            artifacts/extension-wasm/extension.toml
