name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Read-only by default; the CI job neither writes nor needs write scopes.
permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: ShellCheck scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/*.sh

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check (compile without building)
        run: cargo check --workspace --exclude zed-al

      - name: Test
        run: cargo test --workspace --exclude zed-al
        env:
          # Optional real-project tests treat an empty value as unset.
          AL_TEST_PROJECT_PATH: ""

      - name: Clippy
        run: cargo clippy --workspace --exclude zed-al --all-targets -- -D warnings

      - name: Formatting check
        run: cargo fmt --all -- --check

  cargo-deny:
    # Enforces the deny.toml license, advisory, source, and banned-crate policy.
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@8a45e1c7c9a95dfae3276e89a553705e40ae45a2 # v2.0.20
        with:
          arguments: --workspace --exclude zed-al

  wasm:
    name: WASM extension build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable + wasm32-wasip1
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-

      - name: Build zed-al WASM extension
        run: cargo build -p zed-al --target wasm32-wasip1 --release

      # zed-al is excluded from the native workspace job, so run its host tests here.
      - name: Test zed-al (host)
        run: cargo test -p zed-al

      - name: Check repository slug consistency
        run: ./scripts/check-repo-consistency.sh

      - name: Check for stale crates/<name> doc references
        run: ./scripts/check-doc-paths.sh

      - name: Check release hygiene invariants
        run: ./scripts/check-release-hygiene.sh

  windows-native:
    # Default features do not require the .NET semantic bridge.
    name: Windows native build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-native-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-native-cargo-

      - name: Build al-lsp and al-explorer (Windows, default features)
        run: cargo build -p al-lsp -p al-explorer

      - name: Test cross-platform protocol and explorer crates
        run: cargo test -p al-protocol -p al-explorer

      - name: Exercise Windows named-pipe daemon end to end
        run: cargo test -p al-test-harness --test cli_smoke --test extension_smoke
