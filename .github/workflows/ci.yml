name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Read-only by default; the CI job neither writes nor needs write scopes.
permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: ShellCheck scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck \
            scripts/*.sh \
            crates/al-test-harness/editor-e2e/*.sh \
            crates/al-test-harness/editor-e2e/container/*.sh \
            tree-sitter-al/tests/*.sh

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check (compile without building)
        run: cargo check --workspace --exclude zed-al

      # al-test-harness starts these exact executables from target/debug. A
      # workspace `cargo test` only guarantees hashed test-harness binaries
      # under target/debug/deps, so build the production entrypoints explicitly
      # instead of relying on a warm CI cache.
      - name: Build binaries used by end-to-end tests
        run: cargo build -p al-lsp -p al-explorer

      - name: Test
        run: cargo test --workspace --exclude zed-al

      - name: Clippy
        run: cargo clippy --workspace --exclude zed-al --all-targets -- -D warnings

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Benchmark harness contract tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s benchmarks/scripts -p 'test_*_bench.py'

      # Native-only, fixed-fixture Criterion run. This prints measured cold/warm
      # package/index/query timings and owned-cache byte totals, but deliberately
      # makes no Microsoft comparison or threshold claim on shared CI hardware.
      - name: Deterministic symbol and insight performance audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p al-lsp --bench perf -- --warm-up-time 0.1 --measurement-time 0.2 --sample-size 10

  semantic:
    # The `semantic` feature gates al-semantic's in-process CLR host — every
    # `unsafe` FFI block in the workspace lives behind it. The main CI job builds
    # default features only, so until this job existed that code was compiled for
    # the first time by the release workflow, on a tag. A break there fails the
    # release instead of the PR.
    name: Semantic bridge (.NET FFI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # This job runs workspace build scripts (al-semantic shells out to
          # `dotnet build`). Nothing here needs git write access once the
          # submodule is fetched, so don't leave the checkout token behind in
          # .git/config where that build script could reach it.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # al-semantic's build script shells out to `dotnet build` for AlBridge.dll.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: semantic-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            semantic-cargo-

      - name: Build al-lsp with the semantic bridge
        run: cargo build -p al-lsp --bin al-lsp --features semantic

      - name: Test al-semantic with the semantic bridge
        run: cargo test -p al-semantic --features semantic

      - name: Clippy (semantic feature)
        run: cargo clippy -p al-semantic -p al-lsp --features semantic --all-targets -- -D warnings

  cargo-deny:
    # Enforces the deny.toml license, advisory, source, and banned-crate policy.
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace --exclude zed-al

  wasm:
    name: WASM extension build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust stable + wasm32-wasip2
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-

      - name: Build zed-al WASM extension
        run: |
          cargo build -p zed-al --target wasm32-wasip2 --release
          scripts/check-zed-wasm-component.sh target/wasm32-wasip2/release/zed_al.wasm

      # zed-al is excluded from the native workspace job, so run its host tests here.
      - name: Test zed-al (host)
        run: cargo test -p zed-al

      - name: Check repository slug consistency
        run: ./scripts/check-repo-consistency.sh

      - name: Check for stale crates/<name> doc references
        run: ./scripts/check-doc-paths.sh

      - name: Check release hygiene invariants
        run: ./scripts/check-release-hygiene.sh

  windows-native:
    # Default features do not require the .NET semantic bridge.
    name: Windows native build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-native-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-native-cargo-

      - name: Build al-lsp and al-explorer (Windows, default features)
        run: cargo build -p al-lsp -p al-explorer

      - name: Test cross-platform protocol and explorer crates
        run: cargo test -p al-protocol -p al-explorer

      - name: Build Windows daemon integration tests
        run: cargo test -p al-test-harness --test cli_smoke --test extension_smoke --no-run

      - name: Exercise Windows named-pipe CLI end to end
        timeout-minutes: 3
        run: cargo test -p al-test-harness --test cli_smoke

      - name: Exercise Windows extension integration end to end
        timeout-minutes: 3
        run: cargo test -p al-test-harness --test extension_smoke
