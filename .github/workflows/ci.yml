name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Read-only by default; the CI job neither writes nor needs write scopes.
permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally excluded — al-protocol's daemon socket is
        # Unix-only (see F-020), so al-explorer cannot link on Windows. The
        # Zed extension itself ships as platform-neutral WASM.
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable
        # Tracks dtolnay/rust-toolchain's `stable` branch. A pinned commit SHA was
        # used previously but the action force-pushes that branch, orphaning the
        # SHA and breaking every run with "unable to resolve action". The branch
        # ref is the action author's documented, stable entry point.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: ShellCheck scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/*.sh

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check (compile without building)
        run: cargo check --workspace --exclude zed-al

      - name: Test
        run: cargo test --workspace --exclude zed-al
        env:
          # zed_simulation fixture tests silently skip when absent — acceptable in CI
          AL_TEST_PROJECT_PATH: ""

      - name: Clippy
        # --all-targets so lints in test/example/bench code are caught too, not
        # just the default lib/bin targets.
        run: cargo clippy --workspace --exclude zed-al --all-targets -- -D warnings

      - name: Formatting check
        run: cargo fmt --all -- --check

  cargo-deny:
    # Enforces the deny.toml at repo root: license allow-list, banned crates,
    # advisory-DB review, source allow-list. Was previously only documentation
    # — wired into CI per T054 / spec-arch-005. Linux only because cargo-deny
    # itself is fast and platform-independent on the workspace metadata.
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive
      - name: Run cargo-deny
        # v2.0.20: the older pin shipped a cargo-deny that cannot parse
        # `edition = "2024"` (used by crates/al-explorer) and failed with
        # "feature `edition2024` is required". Bumped to a release whose
        # bundled cargo-deny understands the 2024 edition.
        uses: EmbarkStudios/cargo-deny-action@8a45e1c7c9a95dfae3276e89a553705e40ae45a2 # v2.0.20
        with:
          # Default args (`check`) runs all four checks: advisories, bans,
          # licenses, sources — same as the local invocation contract.
          arguments: --workspace --exclude zed-al

  wasm:
    name: WASM extension build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable + wasm32-wasip1
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-

      - name: Build zed-al WASM extension
        run: cargo build -p zed-al --target wasm32-wasip1 --release

      # The main `ci` job excludes zed-al (it targets wasm), so the WASM
      # crate's host-runnable unit tests — including the repo-slug guard that
      # keeps GITHUB_REPO in sync with extension.toml so the LSP download
      # never points at the wrong repository — are exercised here on the host.
      - name: Test zed-al (host)
        run: cargo test -p zed-al

      # Fail the build if the al-lsp download target (GITHUB_REPO in src/lib.rs)
      # drifts from extension.toml / the git remote. A mismatch silently breaks
      # binary resolution for every new user (latest_github_release -> not found).
      - name: Check repository slug consistency
        run: ./scripts/check-repo-consistency.sh

      - name: Check for stale crates/<name> doc references
        run: ./scripts/check-doc-paths.sh

      - name: Check release hygiene invariants
        run: ./scripts/check-release-hygiene.sh

  windows-al-lsp:
    # al-lsp ships on Windows (release.yml), but the main `ci` matrix is Unix-only
    # (al-explorer's AF_UNIX daemon IPC can't link on Windows). Without this, a
    # Windows-specific compile regression — the daemon's #[cfg(not(unix))] stub or
    # the native Windows Credential Manager keyring backend — would only surface at
    # the next release tag (O2). Build-only, and default features (no
    # --features semantic): build.rs skips the .NET bridge when dotnet is absent,
    # so no SDK is needed; the semantic path stays gated by release.yml.
    name: Windows al-lsp build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-al-lsp-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-al-lsp-cargo-

      - name: Build al-lsp (Windows, default features)
        run: cargo build -p al-lsp --bin al-lsp
