name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Read-only by default; the CI job neither writes nor needs write scopes.
permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally excluded — al-protocol's daemon socket is
        # Unix-only (see F-020), so al-explorer cannot link on Windows. The
        # Zed extension itself ships as platform-neutral WASM.
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@56b2e01659f10f03a3269e9a59e022a20813df23 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check (compile without building)
        run: cargo check --workspace --exclude zed-al

      - name: Test
        run: cargo test --workspace --exclude zed-al
        env:
          # zed_simulation fixture tests silently skip when absent — acceptable in CI
          AL_TEST_PROJECT_PATH: ""

      - name: Clippy
        run: cargo clippy --workspace --exclude zed-al -- -D warnings

      - name: Formatting check
        run: cargo fmt --all -- --check

  cargo-deny:
    # Enforces the deny.toml at repo root: license allow-list, banned crates,
    # advisory-DB review, source allow-list. Was previously only documentation
    # — wired into CI per T054 / spec-arch-005. Linux only because cargo-deny
    # itself is fast and platform-independent on the workspace metadata.
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@e2f4ede4a4e60ea15ff31bc0647485d80c66cfba # v2
        with:
          # Default args (`check`) runs all four checks: advisories, bans,
          # licenses, sources — same as the local invocation contract.
          arguments: --workspace --exclude zed-al

  wasm:
    name: WASM extension build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Install Rust stable + wasm32-wasip1
        uses: dtolnay/rust-toolchain@56b2e01659f10f03a3269e9a59e022a20813df23 # stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-cargo-

      - name: Build zed-al WASM extension
        run: cargo build -p zed-al --target wasm32-wasip1 --release
