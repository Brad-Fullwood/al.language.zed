[package]
name = "al-symbols"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AL .app symbol indexing, virtual source, and package download"
repository.workspace = true
[dependencies]
al-types = { path = "../al-types", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
al-bc = { path = "../al-bc", version = "0.1.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
memmap2 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true }
dirs = "6"
rayon = "1"
sha2 = "0.10"
reqwest = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
# OS secret store for OAuth token persistence; crypto-rust keeps the pure-Rust /
# no-OpenSSL cross-compile posture. Custom feature set must be preserved.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "crypto-rust",
    "tokio",
], optional = true }

[features]
default = ["nuget"]
# NuGet/BC symbol download + OAuth. Gates bc_server.rs/nuget.rs/oauth.rs and
# their network/secret-store deps.
nuget = ["dep:al-bc", "dep:keyring", "dep:zeroize", "dep:reqwest"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
