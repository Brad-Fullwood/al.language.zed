[package]
name = "al-insight"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AL insight engine: builds a petgraph object/procedure/event call graph from the symbol index and parsed sources, powering al trace / callgraph / subscribers / intercept / dead-code / impact analysis"
repository.workspace = true
[dependencies]
al-symbols = { path = "../al-symbols", version = "0.1.0", default-features = false }
al-source = { path = "../al-source", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.25"
