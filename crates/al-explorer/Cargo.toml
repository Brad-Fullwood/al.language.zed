[package]
name = "al-explorer"
version = "0.2.2"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "al_explorer"
path = "src/lib.rs"

[[bin]]
name = "al-explorer"
path = "src/main.rs"

[dependencies]
al-protocol = { path = "../al-protocol", version = "0.2.2" }
# Native .app emission (pure Rust, no Microsoft alc) for `pack-native`.
al-emit = { path = "../al-emit", version = "0.1.0" }
# `pack-native --validate`: discover the AL toolchain and run alc as a semantic
# oracle before emitting (alc invocation shells out — no `semantic` feature).
al-project = { path = "../al-project", version = "0.1.0" }
al-compile = { path = "../al-compile", version = "0.1.0" }
# Reads a previous `.app`'s symbols for `breaking --baseline-app` / `upgrade
# --baseline-app`, without going through the daemon.
al-symbols = { path = "../al-symbols", version = "0.1.0", default-features = false }
tokio = { workspace = true }
crossterm = "0.29.0"
ratatui = "0.30.0"
serde = { workspace = true }
serde_json = { workspace = true }
# Folded in from al-cli (stage 8):
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = "6"
url = "2"
