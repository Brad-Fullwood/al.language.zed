[package]
name = "al-compile"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AL project compilation orchestration: `dotnet alc` invocation under a shared cancel/timeout policy with structured diagnostics, plus the pure-Rust native `.app` emit path (native_compile)"
repository = "https://github.com/Brad-Fullwood/al.language.zed"

[dependencies]
al-types = { path = "../al-types" }
al-project = { path = "../al-project" }
al-emit = { path = "../al-emit" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
