[package]
name = "al-snapshot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Breakpoint-sampled BC debug state snapshot record/replay for cross-BC-version regression detection (DAP + tree-sitter source mapping)"
repository = "https://github.com/Brad-Fullwood/al.language.zed"

[dependencies]
al-dap = { path = "../al-dap" }
al-syntax = { path = "../al-syntax" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
