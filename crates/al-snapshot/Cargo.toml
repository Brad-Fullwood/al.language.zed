[package]
name = "al-snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Breakpoint-sampled BC debug state snapshot record/replay for cross-BC-version regression detection (DAP + tree-sitter source mapping)"
repository.workspace = true
[dependencies]
al-dap = { path = "../al-dap", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
