[package]
name = "al-semantic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AL (Business Central) semantic bridge to Microsoft's .NET CodeAnalysis, plus an in-memory builtin cache"
repository.workspace = true
build = "build.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
dirs = "6"
# In-process .NET hosting. Without this feature, bridge initialization returns
# `SemanticError::NotInitialized`.
netcorehost = { version = "0.17", optional = true }

[features]
default = []
semantic = ["dep:netcorehost"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# The exporter's toolchain-version discovery decides whether
# `make check-record-methods` reports real catalog drift or a spurious one, so
# its unit tests must run in the ordinary (non-`semantic`) workspace test pass.
# Cargo defaults examples to `test = false`.
[[example]]
name = "export_record_methods"
test = true
