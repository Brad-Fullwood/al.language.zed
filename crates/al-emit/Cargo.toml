[package]
name = "al-emit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native AL .app (Business Central) package emitter — reproduces alc's SymbolReference.json method-id hashes and OPC/NAVX package layout byte-for-byte, with no Microsoft runtime dependency"
repository = "https://github.com/Brad-Fullwood/al.language.zed"

[dependencies]
al-symbols = { path = "../al-symbols" }
al-syntax = { path = "../al-syntax" }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
getrandom = { workspace = true }
sha2 = "0.10"
tree-sitter = "0.25"

[dev-dependencies]
tempfile = "3"
