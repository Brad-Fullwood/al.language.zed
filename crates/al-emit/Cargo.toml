[package]
name = "al-emit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native AL .app (Business Central) package emitter — reproduces alc's SymbolReference.json method-id hashes and OPC/NAVX package layout semantically identically, with no Microsoft runtime dependency"
repository.workspace = true
[dependencies]
al-symbols = { path = "../al-symbols", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
getrandom = { workspace = true }
sha2 = "0.10"
tree-sitter = "0.25"

[dev-dependencies]
tempfile = "3"
