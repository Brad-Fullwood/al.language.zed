[package]
name = "al-protocol"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Bakes AL_DAEMON_VERSION and AL_BUILD_HASH into every binary that links this
# crate, so a client can recognise a daemon from a different build.
build = "build.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
interprocess = { workspace = true }
tracing = { workspace = true }
# HMAC over the handshake nonce, so a daemon's build identity is not something
# any process on the endpoint can echo back.
sha2 = "0.10"
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
# SO_PEERCRED / getpeereid: who is answering on the endpoint, read from the
# kernel rather than from the answer.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes"] }
