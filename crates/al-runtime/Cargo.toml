[package]
name = "al-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust AL test runtime: tree-walking interpreter, mock BC runtime, and native stub libraries (no .NET CLR, no live BC server)."
repository = "https://github.com/Brad-Fullwood/al.language.zed"

[dependencies]
al-types = { path = "../al-types" }
thiserror = { workspace = true }
# Production parsing walks pre-parsed tree_sitter trees handed in via
# ProcedureSource; only the tree_sitter types are needed (no grammar binding).
tree-sitter = "0.25"
# stubs/any.rs GuidValue() pulls OS entropy via getrandom (prod).
getrandom = { workspace = true }

[dev-dependencies]
# al-syntax is used ONLY in #[cfg(test)] (parsing fixtures + the test_support mock).
al-syntax = { path = "../al-syntax" }
proptest = "1"