[package]
name = "al-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure-Rust AL test runtime: tree-walking interpreter, mock BC runtime, and native stub libraries (no .NET CLR, no live BC server)."
repository.workspace = true
[dependencies]
al-types = { path = "../al-types", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
thiserror = { workspace = true }
# Production execution normally walks pre-parsed trees handed in through
# ProcedureSource. `in [...]` set members are reparsed as ordinary expressions
# because the compatibility grammar intentionally preserves bracket bodies as
# lossless generic blocks.
tree-sitter = "0.25"
# stubs/any.rs GuidValue() pulls OS entropy via getrandom (prod).
getrandom = { workspace = true }
# Value::Decimal is an exact 96-bit decimal (BC System.Decimal semantics, C3).
rust_decimal = { workspace = true }

[dev-dependencies]
proptest = "1"
rust_decimal_macros = { workspace = true }
