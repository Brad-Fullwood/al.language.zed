[package]
name = "al-publish"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AL extension publish pipeline: compile the project (al-compile) then upload + install the .app to a Business Central Dev API endpoint (standard full upload or RAD incremental deploy)"
repository = "https://github.com/Brad-Fullwood/al.language.zed"

[dependencies]
al-bc = { path = "../al-bc" }
al-compile = { path = "../al-compile" }
al-project = { path = "../al-project" }
al-workspace = { path = "../al-workspace" }
al-types = { path = "../al-types" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true }
