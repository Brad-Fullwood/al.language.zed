[package]
name = "al-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "al-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.2", features = ["server", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.0"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
