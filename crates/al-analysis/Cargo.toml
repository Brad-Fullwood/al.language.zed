[package]
name = "al-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AL workspace analysis, editor queries, and code generation"
repository.workspace = true
[dependencies]
al-types = { path = "../al-types", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
# Analysis only consumes the always-available symbol index APIs.
al-symbols = { path = "../al-symbols", version = "0.1.0", default-features = false }
al-source = { path = "../al-source", version = "0.1.0" }
al-semantic = { path = "../al-semantic", version = "0.1.0" }
al-insight = { path = "../al-insight", version = "0.1.0" }
al-project = { path = "../al-project", version = "0.1.0" }
al-workspace = { path = "../al-workspace", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
petgraph = { workspace = true }
tree-sitter = "0.25"
url = { version = "2", features = ["serde"] }
tower-lsp = { workspace = true, optional = true }
rayon = "1"

[features]
# Enable the in-process .NET bridge in both semantic dependencies.
semantic = ["al-semantic/semantic", "al-workspace/semantic"]
# Opt-in tower_lsp wire conversions (the `lsp` module). Default-off keeps
# al-analysis transport-agnostic; al-core's server / al-lsp enable it.
lsp = ["dep:tower-lsp"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
zip = { workspace = true }
