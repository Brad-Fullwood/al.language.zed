[package]
name = "al-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AL analysis & generation layer: the LSP/CLI query engine (completions, hover, definition, references, code lens, diagnostics, semantic tokens, inlay hints, plus dead-code / impact / audit / breaking-change / dependency analysis), type & member resolution, permission-set collection, object/page/report/test generators, project scaffolding, and XLIFF translation tooling. Built on the al-workspace state hub (tier 5)."
repository.workspace = true
[dependencies]
al-types = { path = "../al-types", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
# default-features = false matches al-workspace / al-insight: the analysis layer
# only consumes the always-available SymbolIndex APIs, so it does not pull al-bc
# transitively through al-symbols/nuget. (Verified: no #[cfg(feature=\"nuget\")]
# in any moved file.)
al-symbols = { path = "../al-symbols", version = "0.1.0", default-features = false }
al-source = { path = "../al-source", version = "0.1.0" }
al-semantic = { path = "../al-semantic", version = "0.1.0" }
al-insight = { path = "../al-insight", version = "0.1.0" }
al-project = { path = "../al-project", version = "0.1.0" }
al-workspace = { path = "../al-workspace", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
petgraph = { workspace = true }
tree-sitter = "0.25"
url = { version = "2", features = ["serde"] }
tower-lsp = { workspace = true, optional = true }
rayon = "1"

[features]
# Passthrough so the in-process .NET bridge can be enabled when building/testing
# al-analysis in isolation. In a full `al-core --features semantic` build, Cargo
# feature unification already turns these on via al-core's direct al-semantic /
# al-workspace edges, so the passthrough is belt-and-suspenders.
semantic = ["al-semantic/semantic", "al-workspace/semantic"]
# Opt-in tower_lsp wire conversions (the `lsp` module). Default-off keeps
# al-analysis transport-agnostic; al-core's server / al-lsp enable it.
lsp = ["dep:tower-lsp"]

[dev-dependencies]
# tempfile: scaffold / xliff / format / code_lens / bulk_fix test fixtures.
tempfile = "3"
# tokio (test-only): #[tokio::test] in queries/hover.rs; tokio::runtime::Runtime
# in the queries/code_lens.rs test helper. Library code is plain `async fn` +
# `.await`, which does not require the tokio crate as a normal dependency.
tokio = { workspace = true }
