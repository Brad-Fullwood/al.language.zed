[package]
name = "al-project"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AL project discovery (app.json / .alpackages / NuGet feeds), merged workspace configuration (AlConfig), ALTool toolchain discovery + validation, and the unified AlError/DiscoveryError hierarchy"
repository = "https://github.com/Brad-Fullwood/al.language.zed"

[dependencies]
al-types = { path = "../al-types" }
al-bc = { path = "../al-bc" }
al-semantic = { path = "../al-semantic" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"