[package]
name = "al-bc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Business Central Dev API REST client (OAuth/Basic/NTLM), snapshot + profiler REST, and launch.json/.zed debug-config parsing"
repository.workspace = true
[dependencies]
al-types = { path = "../al-types", version = "0.1.0" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"
urlencoding = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
