[package]
name = "al-bc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Business Central Dev API REST client (OAuth/HTTP Basic — Windows auth is HTTP Basic, not NTLM), snapshot + profiler REST, and launch.json/.zed debug-config parsing"
repository.workspace = true
[dependencies]
al-types = { path = "../al-types", version = "0.1.0" }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
zip = { workspace = true }

# `O_NOFOLLOW` and `O_NONBLOCK` for the snapshot and profile downloads.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Synthetic snapshot builders for other crates' tests. Not for release builds.
test-support = []

[dev-dependencies]
wiremock = "0.6"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serial_test = "3"
tracing-subscriber = { workspace = true }
