[package]
name = "al-bc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Business Central Dev API REST client (OAuth/Basic/NTLM), snapshot + profiler REST, and launch.json/.zed debug-config parsing"
repository = "https://github.com/Brad-Fullwood/al.language.zed"

[dependencies]
al-types = { path = "../al-types" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"
urlencoding = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
