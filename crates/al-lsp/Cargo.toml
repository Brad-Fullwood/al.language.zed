[package]
name = "al-lsp"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "al-lsp"
path = "src/bin/al-lsp.rs"
required-features = ["bin"]



[dependencies]
al-protocol = { path = "../al-protocol", version = "0.2.2" }
al-types = { path = "../al-types", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
al-semantic = { path = "../al-semantic", version = "0.1.0" }
al-bc = { path = "../al-bc", version = "0.1.0" }
al-snapshot = { path = "../al-snapshot", version = "0.1.0" }
al-test = { path = "../al-test", version = "0.1.0" }
al-runtime = { path = "../al-runtime", version = "0.1.0" }
al-source = { path = "../al-source", version = "0.1.0" }
al-dap = { path = "../al-dap", version = "0.1.0" }
al-project = { path = "../al-project", version = "0.1.0" }
al-symbols = { path = "../al-symbols", version = "0.1.0" }
al-emit = { path = "../al-emit", version = "0.1.0" }
al-insight = { path = "../al-insight", version = "0.1.0" }
al-compile = { path = "../al-compile", version = "0.1.0" }
al-workspace = { path = "../al-workspace", version = "0.1.0" }
al-publish = { path = "../al-publish", version = "0.1.0" }
al-analysis = { path = "../al-analysis", version = "0.1.0", features = ["lsp"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
interprocess = { workspace = true }
tower-lsp = { workspace = true }
tracing = { workspace = true }
tree-sitter = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
# Folded in from al-symbols (stage 5):
dirs = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
# Folded in from al-lsp (stage 7):
# tracing-subscriber is binary-only — only the [[bin]] al-lsp target wires it
# up. Opt-in via the `bin` feature so library consumers (al-test-harness, the
# in-tree test crates) don't pay for the layered registry / EnvFilter pull-in.
tracing-subscriber = { workspace = true, optional = true }

# `getrusage`, for the peak resident size `status` and `diag` report.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = ["nuget", "bin"]
nuget = ["al-symbols/nuget"]
# `bin` is on by default (so `cargo build --workspace` still produces al-lsp),
# but library consumers can opt out with default-features = false to drop the
# tracing-subscriber tree.
bin = ["dep:tracing-subscriber"]
# Enable in-process .NET hosting (requires libnethost from the .NET SDK).
# Off by default so workspace commands work in environments without .NET.
# Passthrough to al-semantic, which owns the netcorehost dependency.
semantic = ["al-semantic/semantic"]

[dev-dependencies]
serial_test = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Deterministic symbol/insight perf benchmarks (cold/warm load, lookup,
# completion, impact, trace + memory metric). See Docs/benchmarks.md.
[[bench]]
name = "perf"
harness = false
