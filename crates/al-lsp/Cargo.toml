[package]
name = "al-lsp"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "al-lsp"
path = "src/bin/al-lsp.rs"
required-features = ["bin"]



[dependencies]
al-protocol = { path = "../al-protocol", version = "0.2.2" }
al-types = { path = "../al-types", version = "0.1.0" }
al-syntax = { path = "../al-syntax", version = "0.1.0" }
al-semantic = { path = "../al-semantic", version = "0.1.0" }
al-bc = { path = "../al-bc", version = "0.1.0" }
al-snapshot = { path = "../al-snapshot", version = "0.1.0" }
al-test = { path = "../al-test", version = "0.1.0" }
al-runtime = { path = "../al-runtime", version = "0.1.0" }
al-source = { path = "../al-source", version = "0.1.0" }
al-dap = { path = "../al-dap", version = "0.1.0" }
al-project = { path = "../al-project", version = "0.1.0" }
al-symbols = { path = "../al-symbols", version = "0.1.0" }
al-emit = { path = "../al-emit", version = "0.1.0" }
al-insight = { path = "../al-insight", version = "0.1.0" }
al-compile = { path = "../al-compile", version = "0.1.0" }
al-workspace = { path = "../al-workspace", version = "0.1.0" }
al-publish = { path = "../al-publish", version = "0.1.0" }
al-analysis = { path = "../al-analysis", version = "0.1.0", features = ["lsp"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
interprocess = { workspace = true }
tower-lsp = { workspace = true }
dashmap = { workspace = true }
ropey = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.25"
# AL grammar: canonical tree-sitter binding crate (compiles src/parser.c itself).
tree-sitter-al = { path = "../../tree-sitter-al", version = "0.1.0" }
url = "2"
urlencoding = "2"
petgraph = { workspace = true }
reqwest = { workspace = true }
# rustls-tls-native-roots: rustls TLS using the OS trust store, so the SignalR
# websocket client has no system-OpenSSL build dep (cross-compiles to aarch64).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
# Folded in from al-symbols (stage 5):
dirs = "6"
zip = { workspace = true }
quick-xml = { workspace = true }
sha2 = "0.10"
memmap2 = { workspace = true }
rayon = "1"
getrandom = { workspace = true }
futures = { workspace = true }
# Zeroize OAuth bearer and refresh secrets on drop.
zeroize = { workspace = true }
# OS secret store (Secret Service / Keychain / Credential Manager) for OAuth
# token persistence keeps the 90-day refresh token off plaintext disk.
# crypto-rust keeps the pure-Rust / no-OpenSSL cross-compile posture; the code
# falls back to the hardened 0o600 file when no backend is available (headless
# Linux / CI), so auth never breaks because a keyring is absent.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "crypto-rust",
    "tokio",
] }
# Folded in from al-lsp (stage 7):
# tracing-subscriber is binary-only — only the [[bin]] al-lsp target wires it
# up. Opt-in via the `bin` feature so library consumers (al-test-harness, the
# in-tree test crates) don't pay for the layered registry / EnvFilter pull-in.
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["nuget", "bin"]
nuget = ["al-symbols/nuget"]
# `bin` is on by default (so `cargo build --workspace` still produces al-lsp),
# but library consumers can opt out with default-features = false to drop the
# tracing-subscriber tree.
bin = ["dep:tracing-subscriber"]
# Enable in-process .NET hosting (requires libnethost from the .NET SDK).
# Off by default so workspace commands work in environments without .NET.
# Passthrough to al-semantic, which owns the netcorehost dependency.
semantic = ["al-semantic/semantic"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Deterministic symbol/insight perf benchmarks (cold/warm load, lookup,
# completion, impact, trace + memory metric). See Docs/benchmarks.md.
[[bench]]
name = "perf"
harness = false
