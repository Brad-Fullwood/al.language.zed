[package]
name = "al-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "al-lsp"
path = "src/bin/al-lsp.rs"
required-features = ["bin"]

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "parser"
harness = false

[dependencies]
al-protocol = { path = "../al-protocol" }
netcorehost = { version = "0.17", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-lsp = { workspace = true }
dashmap = { workspace = true }
ropey = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.25"
url = "2"
urlencoding = "2"
petgraph = { workspace = true }
reqwest = { workspace = true }
# rustls-tls-native-roots: rustls TLS using the OS trust store, so the SignalR
# websocket client has no system-OpenSSL build dep (cross-compiles to aarch64).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
# Folded in from al-symbols (stage 5):
dirs = "6"
zip = { workspace = true }
quick-xml = { workspace = true }
sha2 = "0.10"
memmap2 = { workspace = true }
rayon = "1"
getrandom = { workspace = true }
futures = { workspace = true }
# Zeroize OAuth bearer/refresh secrets on drop — al-lsp is a long-lived daemon
# (F-OPEN-010). Pre-approved direct dependency.
zeroize = { workspace = true }
# Folded in from al-lsp (stage 7):
# tracing-subscriber is binary-only — only the [[bin]] al-lsp target wires it
# up. Opt-in via the `bin` feature so library consumers (al-test-harness, the
# in-tree test crates) don't pay for the layered registry / EnvFilter pull-in.
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["nuget", "bin"]
nuget = []
# `bin` is on by default (so `cargo build --workspace` still produces al-lsp),
# but library consumers can opt out with default-features = false to drop the
# tracing-subscriber tree. T060.
bin = ["dep:tracing-subscriber"]
# Enable in-process .NET hosting (requires libnethost from the .NET SDK).
# Off by default so workspace commands work in environments without .NET.
# Enable with --features semantic when building for deployment.
semantic = ["dep:netcorehost"]

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
