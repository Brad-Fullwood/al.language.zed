[package]
name = "al-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "al-lsp"
path = "src/bin/al-lsp.rs"

[dependencies]
al-protocol = { path = "../al-protocol" }
netcorehost = { version = "0.17", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-lsp = { workspace = true }
dashmap = { workspace = true }
ropey = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.25"
url = "2"
urlencoding = "2"
petgraph = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
# Folded in from al-symbols (stage 5):
dirs = "6"
zip = { workspace = true }
quick-xml = { workspace = true }
sha2 = "0.10"
memmap2 = { workspace = true }
rayon = "1"
getrandom = { workspace = true }
futures = { workspace = true }
# Folded in from al-lsp (stage 7):
tracing-subscriber = { workspace = true }
walkdir = "2"

[features]
default = ["nuget"]
nuget = []
# Enable in-process .NET hosting (requires libnethost from the .NET SDK).
# Off by default so workspace commands work in environments without .NET.
# Enable with --features semantic when building for deployment.
semantic = ["dep:netcorehost"]

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
