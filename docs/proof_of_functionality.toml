# 1. This file is a TOML document. Append new [[entries]] under the appropriate WP section.
# 2. Every entry MUST follow the "Red-to-Green" flow: show the failure first, then the success.
# 3. Use multi-line strings (""" """) for log outputs to keep them readable.
# 4. Success-only entries without an Adversarial Pass are invalid.
# 5. Status values: adversarial_pass = "FAILED_AS_EXPECTED", fidelity_pass = "SUCCESS".
