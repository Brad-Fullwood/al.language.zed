# Task Plan — Zed AL Extension
# Merged plan + progress. Single source of truth for all task data.
# Source: docs/plan.md + docs/progress.md
# Last synced: 2026-03-15

# =============================================================================
# CRITICAL PATH
# =============================================================================
#
# Minimum task sequence to reach a working state where al-lsp serves both Zed
# (stdio) and daemon clients (CLI/Explorer/MCP) via al-core:
#
# T001 (WP0 Harness bootstrap)
#   |
# T101 -> T102 -> T103 -> T104  (WP1: al-core skeleton + discovery migration)
#   |                       |
# T201 -> T202 -> T203      |   (WP2: DocumentStore + parse cache in al-core)
#                   |       |
#                   v       v
#                T301 -> T302 -> T303 -> T304 -> T305  (WP3: query migration + daemon + thin adapters)
#                                                   |
#                                          T401 -> T402  (WP4: DAP fold + toolchain)
#                                                   |
#                                          T403 -> T404a -> T404b -> T404c  (WP4: al-dap-client + debug session)
#                                                         |-> T404d  (WP4: state inspection, parallel with T404c)
#                                                 T404c + T404d -> T404e -> T405  (WP4: wire-up + history)
#                                                   |
#                                 T501 -> T502 -> T504 -> T505  (WP5: assets + tokens + analyzers)
#                                                   |
#                                          T601 -> T602 -> T603  (WP6: WASM + settings)
#                                                   |
#                                 T610 -> T611 -> T612  (WP6.5: error handling + build/publish)
#                                          |
#                                 T613  T614  T615  T616  (WP6.5: scaffold, perms, snapshots, profiling)
#
# Minimum viable loop (Zed works end-to-end with new architecture):
#   T001 through T305 = 17 tasks across WP0-WP3.
# Full production path adds WP4-WP11 = ~40 total tasks.
#
# Critical Dependencies (cross-WP):
# - T301 (query migration) requires T104 (al-core compiles with discovery) AND T203 (DocumentStore in al-core).
# - T303 (daemon mode) is WP3 but unblocks ALL thin adapter work (T304, T305, T601, T1001).
# - T501 (grammar sync) is independent of WP1-WP4; can run in parallel.
# - WP7-WP10 are additive and can be parallelized after WP3.

[meta]
total_work_packages = 30  # WP0-WP11 (12) + WPX + WP6_5 + WP12-WP18 (7 advanced) + WP19-WP27 (9 production readiness)

# =============================================================================
# WORK PACKAGES
# =============================================================================

[[work_packages]]
id = "WP0"
name = "Project Constitution & The Adversarial Harness"
phase = "Phase 0: The Adversarial Foundation"
goal = "Establish the project's rules and build its 'Immune System'. Create CLAUDE.md, evaluate and define required Claude Skills or Agents, build an LSP simulator with high Zed-fidelity in al-test-harness, and implement the Centralized Evidence Log system in TOML."
gating = "No other work packages may start until WP0 is verified."

[[work_packages]]
id = "WPX"
name = "Continuous Adversarial Evolution (Persistent)"
phase = "Phase 0: The Adversarial Foundation"
goal = "A sub-agent is permanently deployed to break the code and interrogate the log. Identify where the harness lacks Zed-fidelity. Interrogate proof_of_functionality.toml for tasks with insufficient negative testing. Discovered gaps are reported to the PM as immediate blocking issues."

[[work_packages]]
id = "WP1"
name = "al-core Skeleton & Discovery Migration"
phase = "Phase 1: Foundation & Core Refactor"
goal = "Establish the central 'brain' and project discovery logic. Create al-core, implement the Workspace state container, and migrate al-discovery (project/toolchain/launch) into al-core."
zed_impact = "Provides the foundation for project loading and toolchain detection in Zed."
agent_impact = "Accurate project discovery for CLI/MCP queries."

[[work_packages]]
id = "WP2"
name = "Workspace State & Document Management"
phase = "Phase 1: Foundation & Core Refactor"
goal = "Centralize document handling and parse caching. Move DocumentStore from al-lsp to al-core. Implement rope-based text and incremental parse tree caching in the core."
zed_impact = "Faster file opening and typing responsiveness."
agent_impact = "Stable, cached state for multi-turn agent interactions."

[[work_packages]]
id = "WP3"
name = "LSP & CLI Thin Adapters (Query Engine)"
phase = "Phase 2: Binary Thinning & Language Parity"
goal = "Move query logic to the core and thin out the binaries. Migrate hover, definition, completions, and references to al-core::queries. Refactor al-lsp (transport) and al-cli (agent discovery) to use these queries."
zed_impact = "Reliable, standard LSP behavior."
agent_impact = "Surgical, context-dense discovery calls."

[[work_packages]]
id = "WP4"
name = "DAP Integration, Toolchain Logic & Agentic Debugger"
phase = "Phase 2: Binary Thinning & Language Parity"
goal = "Fold debugging and toolchain management into the core/LSP. Expose headless debug control for agentic debugging. Merge al-dap into al-lsp::dap. Refactor EditorServices management to use al-core::toolchain. Implement al debug CLI/MCP for headless DAP control with variable inspection, expression evaluation, and debug history recording."
zed_impact = "Seamless 'Publish & Debug' from Zed."
agent_impact = "Full agentic debugging — AI agents can start debug sessions, set conditional breakpoints, step through code, inspect variables, evaluate expressions, and review debug history. All via CLI/MCP with no UI required."

[[work_packages]]
id = "WP5"
name = "Language Config & Asset Parity"
phase = "Phase 3: Assets & Zed Integration"
goal = "High-fidelity Zed integration and snippet parity. Sync grammar, import 23 snippet files, and implement highlights.scm, runnables.scm, and brackets.scm. Implement all Zed tasks (AL: Go, AL: Publish, etc.)."
zed_impact = "Beautiful highlighting, snippets, and task-based workflows."
agent_impact = "Parity in available commands and scaffold generation."

[[work_packages]]
id = "WP6"
name = "WASM Entry & Settings Implementation"
phase = "Phase 3: Assets & Zed Integration"
goal = "Clean up the user-facing extension entry point. Refactor zed-al (WASM) to remove fallbacks. Implement full settings map in al-core::config."
zed_impact = "Explicit, predictable settings behavior; no 'auto-download' surprises."

[[work_packages]]
id = "WP6_5"
name = "Build/Publish Pipeline & Error Handling"
phase = "Phase 3: Assets & Zed Integration"
goal = "Implement the full build/publish lifecycle and eliminate silent failures. Package, publish (standard + RAD), project scaffolding, permission set generation, snapshot debugging. Audit and fix all silent error handling."
zed_impact = "Full development lifecycle without leaving Zed — compile, publish, debug, profile."
agent_impact = "Agentic build/deploy (compile, publish, verify via CLI/MCP)."

[[work_packages]]
id = "WP7"
name = "Symbol Indexing & Semantic Optimization"
phase = "Phase 4: Advanced Intelligence & Performance"
goal = "Scale analysis to large AL projects. Refactor al-symbols for better composition. Optimize al-semantic bridge management (caching, process lifetime) within al-core."
zed_impact = "Instant symbol navigation across massive projects."
agent_impact = "100% accurate symbol resolution for cross-package dependencies."

[[work_packages]]
id = "WP8"
name = "Caching & Observability"
phase = "Phase 4: Advanced Intelligence & Performance"
goal = "Meet performance targets and add system transparency. Implement disk caching for symbols/ASTs. Integrate al-diag for request tracing and latency monitoring."
zed_impact = "Sub-10ms hover/completion; fast warm starts."

[[work_packages]]
id = "WP9"
name = "Insight Graph & Agent Discovery Engine"
phase = "Phase 5: AL Insight (The Killer App)"
goal = "Build the publisher-subscriber and call-graph engine. Implement al-core::insight using petgraph. Ensure the CLI/MCP/TUI can perform complex traces (e.g., event chain) in a single call."
zed_impact = "Visual call graphs and event traces in al-explorer."
agent_impact = "Context-dense traces that replace manual file scanning."

[[work_packages]]
id = "WP10"
name = "Explorer & TUI Transformation"
phase = "Phase 5: AL Insight (The Killer App)"
goal = "Provide a rich UI for workspace exploration. Refactor al-explorer into a modular TUI consuming al-core data."
zed_impact = "High-density object/event designer accessible via Zed task."

[[work_packages]]
id = "WP11"
name = "Integration & Release Engineering"
phase = "Phase 6: Validation & Release"
goal = "Finalize for production. Exhaustive integration testing via al-test-harness. Finalize deterministic build/release pipeline."

