# Beyond-Parity Unique Features

[[unique_features]]
id = 1
name = "Insight Tooling"
description = "Event graph, call trace, table relations, entry point finder."
cli = "al tables, al callgraph, al intercept, al subscribers"

[[unique_features]]
id = 2
name = "Dead Code Detection"
description = "Cross-file analysis: unused procedures, unreachable triggers, unused table fields (never referenced in any page/report), unused event subscribers (publisher removed), unused permission sets. Implementation: Reverse-reference graph from symbol index. Find nodes with zero inbound edges."
cli = "al dead-code [--json]"

[[unique_features]]
id = 3
name = "Dependency Impact Analysis"
description = "If I change this procedure signature, which extensions break? Query symbol index across all .app packages to show downstream consumers. Implementation: Dependency graph from app.json + symbol references. Trace consumers across dependency tree."
cli = "al impact <symbol> [--json]"

[[unique_features]]
id = 4
name = "AI-Assisted Event Wiring"
description = "Given a business scenario (e.g., 'validate customer credit limit on sales order'), suggest the correct event publisher, subscriber pattern, and integration event chain. Implementation: Index all event publishers from base app symbols. Map business concepts to event chains via keyword matching + object context."
cli = "al suggest-event <description> [--json]"
notes = "Slash command: /al-events with natural language argument"

[[unique_features]]
id = 5
name = "Automated Permission Set Generation from Usage Analysis"
description = "Analyze all table/page/report/codeunit accesses in an extension and auto-generate the minimal permission set. Update when code changes. Implementation: Walk AST for record operations (Insert, Modify, Delete, FindSet, Get) and RunObject references. Generate RIMD permissions."
cli = "al permissionset --analyze [--json]"
notes = "Already have basic permissionset command"

[[unique_features]]
id = 6
name = "Code Complexity Metrics Dashboard"
description = "Project-wide complexity: hotspot detection, procedure-level rankings, per-file summaries. Implementation: AST-based cyclomatic/cognitive complexity computation in al-syntax."
cli = "al metrics [file] [--json]"

[[unique_features]]
id = 7
name = "Offline Test Discovery & Scaffolding"
description = "Static analysis of test codeunits without requiring a BC instance. Discover [Test] procedures, map test-to-code coverage, generate test scaffolds for untested procedures. Implementation: Parse [Test] attributes, build call graphs from syntax, identify untested public procedures."
cli = "al tests [--scaffold] [--coverage-map] [--json]"

[[unique_features]]
id = 8
name = "Smart Rename with Translation Awareness"
description = "Rename a field and automatically update: caption, tooltip, XLIFF translation keys, all code references. Implementation: Combine rename provider with XLIFF file parsing and caption/tooltip property detection."
cli = ""
notes = "LSP: Enhanced textDocument/rename that includes XLIFF changes in the workspace edit"

[[unique_features]]
id = 9
name = "Architectural Linting"
description = "Enforce project-specific patterns like 'no direct table access from pages' or 'all external calls through facade codeunit.' Rules defined in a .alarch.json config file. Implementation: Custom rule engine in al-core checking cross-object access patterns."
cli = "al lint --arch [--json]"

[[unique_features]]
id = 10
name = "Cross-Extension Event Trace Visualization"
description = "Given a starting point (e.g., 'Post Sales Order'), trace the complete event chain across ALL installed extensions, showing execution sequence. Implementation: Combine event publisher/subscriber symbol index with call graph analysis across packages."
cli = "al trace --cross-extension <entry-point> [--json]"

[[unique_features]]
id = 11
name = "Zed AI Integration"
description = "Leverage Zed's extension API for deep AI integration: slash commands (/al-symbols, /al-events, /al-trace, /al-deps, /al-lint) inject structured context; indexed docs feed BC symbol documentation to Zed's AI via index_docs provider; register al-mcp as MCP context server in Zed's Agent Panel."
cli = ""
notes = "Slash commands: /al-symbols, /al-events, /al-trace, /al-deps, /al-lint. Schemas defined in .claude/data/agentic-schemas.md"

