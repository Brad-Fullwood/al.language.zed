# Agentic Schemas — JSON output formats for CLI and MCP
# Agents check this when implementing or consuming CLI/MCP commands.
# 1:1 CLI/MCP parity: same schema from `al <cmd> --json` and `al/<cmd>` MCP tool.
# All positions are 1-based (CLI). No version field — versioned by CLI/MCP binary version.

# ─── Design Principles ────────────────────────────────────────────────────────
# 1. Token Density: every JSON field earns its place. No null fields, no wrappers.
# 2. 250-Token Budget: a complex cross-file event trace must fit in ~250 tokens.
# 3. Actionable References: every result includes file + line + col for navigation.
# 4. Progressive Disclosure: search → object → hover. Summary first, details on demand.
# 5. Schema Versioning: no version field. Breaking changes require a major bump in al-cli.

# ─── Slash Commands (Zed context injection) ───────────────────────────────────

[[schemas]]
command = "/al-symbols"
description = "Search workspace and package symbols (Zed slash command)"
args = "<query>"

[schemas.output]
format = "object"
fields = [
  { name = "symbols", type = "array", description = "List of matching symbols" },
]

[schemas.output.symbols_item]
fields = [
  { name = "k",   type = "string",       description = "Object kind (Table, Page, Codeunit, …)" },
  { name = "id",  type = "int",          description = "Object ID" },
  { name = "n",   type = "string",       description = "Symbol name" },
  { name = "pkg", type = "string",       description = "Package name" },
  { name = "f",   type = "string|null",  description = "File path (null = package-only, no .al source)" },
  { name = "l",   type = "int|null",     description = "1-based line (null = package-only)" },
]

[schemas.example]
json = '{"symbols":[{"k":"Table","id":18,"n":"Customer","pkg":"Base Application","f":"src/Customer.al","l":1},{"k":"Page","id":21,"n":"Customer Card","pkg":"Base Application","f":null,"l":null}]}'
token_budget = "~100 tokens for 5-10 results"

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-events"
description = "Trace event publisher/subscriber chain (Zed slash command)"
args = "<event-name>"

[schemas.output]
format = "object"
fields = [
  { name = "event", type = "string",      description = "Event name" },
  { name = "pub",   type = "object",      description = "Publisher location" },
  { name = "subs",  type = "array",       description = "Subscriber list" },
]

[schemas.output.pub_fields]
fields = [
  { name = "k",    type = "string", description = "Object kind" },
  { name = "id",   type = "int",    description = "Object ID" },
  { name = "n",    type = "string", description = "Object name" },
  { name = "proc", type = "string", description = "Procedure that publishes the event" },
  { name = "l",    type = "int",    description = "1-based line of the event declaration" },
]

[schemas.output.subs_item]
fields = [
  { name = "k",    type = "string",      description = "Object kind" },
  { name = "id",   type = "int",         description = "Object ID" },
  { name = "n",    type = "string",      description = "Object name" },
  { name = "proc", type = "string",      description = "Subscriber procedure name" },
  { name = "f",    type = "string|null", description = "File path (null = package)" },
  { name = "l",    type = "int|null",    description = "1-based line (null = package)" },
  { name = "pkg",  type = "string",      description = "Package name or 'workspace'" },
]

[schemas.example]
json = '{"event":"OnAfterPostSalesDocument","pub":{"k":"Codeunit","id":80,"n":"Sales-Post","proc":"PostDocument","l":245},"subs":[{"k":"Codeunit","id":50100,"n":"My Subscriber","proc":"OnAfterPostSalesDocument","f":"src/MySub.al","l":32,"pkg":"workspace"},{"k":"Codeunit","id":1535,"n":"Approvals Mgmt","proc":"OnAfterPostSalesDoc","f":null,"l":null,"pkg":"Base Application"}]}'
token_budget = "~150 tokens for publisher + 5 subscribers"

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-object"
mcp_tool = "al/object"
cli_command = "al object --json"
description = "Full object API surface: fields, procedures, events"
args = "<name> [--kind KIND]"

[schemas.output]
format = "object"
fields = [
  { name = "k",      type = "string", description = "Object kind" },
  { name = "id",     type = "int",    description = "Object ID" },
  { name = "n",      type = "string", description = "Object name" },
  { name = "fields", type = "array",  description = "Fields (tables only)" },
  { name = "procs",  type = "array",  description = "Procedures/methods" },
  { name = "events", type = "array",  description = "Event names published by this object" },
]

[schemas.output.fields_item]
fields = [
  { name = "id", type = "int",     description = "Field ID" },
  { name = "n",  type = "string",  description = "Field name" },
  { name = "t",  type = "string",  description = "Field type" },
  { name = "pk", type = "bool",    description = "Part of primary key (omitted when false)" },
]

[schemas.output.procs_item]
fields = [
  { name = "n",      type = "string", description = "Procedure name" },
  { name = "params", type = "string", description = "Parameter list as text" },
  { name = "ret",    type = "string", description = "Return type (empty string = void)" },
]

[schemas.example]
json = '{"k":"Table","id":18,"n":"Customer","fields":[{"id":1,"n":"No.","t":"Code[20]","pk":true},{"id":2,"n":"Name","t":"Text[100]"}],"procs":[{"n":"SetFilter","params":"FilterStr: Text","ret":""},{"n":"GetBalance","params":"","ret":"Decimal"}],"events":["OnAfterModifyEvent","OnBeforeDeleteEvent"]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-trace"
mcp_tool = "al/trace"
cli_command = "al trace --json"
description = "Call chain trace from a source position"
args = "<file> <line>"

[schemas.output]
format = "object"
fields = [
  { name = "origin", type = "object", description = "Starting location" },
  { name = "chain",  type = "array",  description = "Call chain entries in depth-first order" },
]

[schemas.output.origin_fields]
fields = [
  { name = "f",    type = "string", description = "File path" },
  { name = "l",    type = "int",    description = "1-based line" },
  { name = "proc", type = "string", description = "Enclosing procedure name" },
]

[schemas.output.chain_item]
fields = [
  { name = "depth",  type = "int",          description = "Call depth (1 = direct call from origin)" },
  { name = "k",      type = "string",        description = "Entry type: 'call' or 'event'" },
  { name = "target", type = "string",        description = "Called procedure or event name" },
  { name = "obj",    type = "string",        description = "Object containing the target" },
  { name = "l",      type = "int|null",      description = "1-based line (null if not resolved)" },
  { name = "subs",   type = "int",           description = "Subscriber count (event entries only)" },
]

[schemas.example]
json = '{"origin":{"f":"src/SalesPost.al","l":120,"proc":"PostDocument"},"chain":[{"depth":1,"k":"call","target":"ValidateCustomer","obj":"Sales-Post","l":125},{"depth":2,"k":"call","target":"CheckCreditLimit","obj":"Sales-Post","l":340},{"depth":2,"k":"event","target":"OnCheckCreditLimit","subs":3},{"depth":3,"k":"call","target":"LogEntry","obj":"My Logger","l":15}]}'
token_budget = "~100 tokens for depth-3 chain"

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-deps"
mcp_tool = "al/deps"
cli_command = "al deps --json"
description = "Dependency graph summary for the current workspace app"
args = ""

[schemas.output]
format = "object"
fields = [
  { name = "app",        type = "string", description = "Current app name" },
  { name = "version",    type = "string", description = "Current app version" },
  { name = "deps",       type = "array",  description = "Direct dependencies" },
  { name = "transitive", type = "array",  description = "Transitive (indirect) dependencies" },
  { name = "depBy",      type = "array",  description = "Apps that depend on this one (workspace-local)" },
]

[schemas.output.deps_item]
fields = [
  { name = "n",      type = "string", description = "Package name" },
  { name = "v",      type = "string", description = "Version string" },
  { name = "id",     type = "string", description = "App GUID" },
  { name = "direct", type = "bool",   description = "True if listed in app.json dependencies (omitted for transitive array)" },
]

[schemas.example]
json = '{"app":"My Extension","version":"1.0.0","deps":[{"n":"Base Application","v":"26.0.0.0","direct":true}],"transitive":[{"n":"System","v":"26.0.0.0"}],"depBy":[]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-source"
mcp_tool = "al/source"
cli_command = "al source --json"
description = "Targeted source code extraction: full object, specific procedure, or specific trigger"
args = "<object> [--proc <name>] [--trigger <name>]"

[schemas.notes]
src_values = "'workspace' = full source from .al file | 'package' = extracted from .app | 'outline' = rendered from SymbolReference.json (full signatures + fields, no bodies)"
no_fallbacks = "If source is in the .app, extract it. If not, render a complete outline — outline is the primary output, not a degraded mode."
outline_must_include = "Full procedure signatures (params + return types), field definitions (id + type), keys, enum values, event declarations."

[schemas.output]
format = "object"
fields = [
  { name = "k",     type = "string",      description = "Object kind" },
  { name = "id",    type = "int",         description = "Object ID" },
  { name = "n",     type = "string",      description = "Object name" },
  { name = "proc",  type = "string",      description = "Procedure name (when --proc used)" },
  { name = "src",   type = "string",      description = "'workspace' | 'package' | 'outline'" },
  { name = "pkg",   type = "string",      description = "Package name (package/outline only)" },
  { name = "range", type = "object|null", description = "Source range (workspace/package only)" },
  { name = "sig",   type = "string",      description = "Procedure signature (when --proc used)" },
  { name = "code",  type = "string",      description = "Source code or rendered outline" },
  { name = "note",  type = "string",      description = "Explanation note (outline only)" },
]

[schemas.output.range_fields]
fields = [
  { name = "f",   type = "string", description = "File path" },
  { name = "l",   type = "int",    description = "1-based start line" },
  { name = "end", type = "int",    description = "1-based end line" },
]

[schemas.examples]
workspace_proc = '{"k":"Codeunit","id":50100,"n":"Sales Processor","proc":"PostDocument","src":"workspace","range":{"f":"src/SalesProcessor.al","l":25,"end":85},"sig":"procedure PostDocument(var SalesHeader: Record \"Sales Header\")","code":"    procedure PostDocument(...)\n    begin\n        ...\n    end;"}'
package_proc = '{"k":"Codeunit","id":80,"n":"Sales-Post","proc":"PostSalesDocument","src":"package","pkg":"Base Application","sig":"procedure PostSalesDocument(var SalesHeader: Record \"Sales Header\")","code":"    procedure PostSalesDocument(...)\n    begin\n        ...\n    end;"}'
outline = '{"k":"Table","id":18,"n":"Customer","src":"outline","pkg":"Base Application","code":"table 18 Customer\n{\n    fields\n    {\n        field(1; \"No.\"; Code[20]) { }\n        field(2; Name; Text[100]) { }\n    }\n\n    procedure SetFilter(FilterStr: Text)\n    procedure GetBalance(): Decimal\n}","note":"Rendered from symbol metadata — full signatures and fields, no implementation bodies"}'
token_budget = "~80 tokens single procedure, ~200-400 full object"

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-tables"
mcp_tool = "al/tables"
cli_command = "al tables --json"
description = "What tables does this object/procedure read or write?"
args = "<object> [--proc <name>]"

[schemas.notes]
ops_values = "Record operations: get, find, findset, findfirst, findlast, insert, modify, delete, modifyall, deleteall, setrange, setfilter, calcsums, calcfields, reset, init"

[schemas.output]
format = "object"
fields = [
  { name = "object", type = "string", description = "Object name" },
  { name = "id",     type = "int",    description = "Object ID" },
  { name = "tables", type = "array",  description = "Tables accessed" },
]

[schemas.output.tables_item]
fields = [
  { name = "id",    type = "int",    description = "Table ID" },
  { name = "n",     type = "string", description = "Table name" },
  { name = "ops",   type = "array",  description = "Record operations found (strings from ops_values)" },
  { name = "procs", type = "array",  description = "Procedures where this table is accessed" },
]

[schemas.example]
json = '{"object":"Sales-Post","id":80,"tables":[{"id":36,"n":"Sales Header","ops":["get","modify","delete"],"procs":["PostDocument","FinalizePost"]},{"id":37,"n":"Sales Line","ops":["findset","modify","insert"],"procs":["PostLines"]},{"id":21,"n":"Cust. Ledger Entry","ops":["insert"],"procs":["PostCustLedger"]}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-callgraph"
mcp_tool = "al/callgraph"
cli_command = "al callgraph --json"
description = "Transitive call graph across object boundaries (calls + events + table touches)"
args = "<object> [--proc <name>] [--depth N]"

[schemas.notes]
depth_default = "3"
depth_max = "10"
entry_types = "'call' = procedure call | 'event' = event emission | 'sub' = event subscriber"

[schemas.output]
format = "object"
fields = [
  { name = "root",  type = "object", description = "Root call location" },
  { name = "depth", type = "int",    description = "Requested depth limit" },
  { name = "calls", type = "array",  description = "Call graph entries in depth-first order" },
]

[schemas.output.root_fields]
fields = [
  { name = "k",    type = "string", description = "Object kind" },
  { name = "id",   type = "int",    description = "Object ID" },
  { name = "n",    type = "string", description = "Object name" },
  { name = "proc", type = "string", description = "Root procedure name" },
]

[schemas.output.calls_item]
fields = [
  { name = "d",      type = "int",    description = "Call depth" },
  { name = "type",   type = "string", description = "'call' | 'event' | 'sub'" },
  { name = "proc",   type = "string", description = "Procedure or event name" },
  { name = "obj",    type = "string", description = "Object containing this entry" },
  { name = "tables", type = "array",  description = "Table names touched in this call (strings)" },
  { name = "subs",   type = "int",    description = "Subscriber count (event entries only)" },
]

[schemas.example]
json = '{"root":{"k":"Codeunit","id":80,"n":"Sales-Post","proc":"PostDocument"},"depth":3,"calls":[{"d":1,"type":"call","proc":"ValidateHeader","obj":"Sales-Post","tables":["Sales Header"]},{"d":1,"type":"call","proc":"PostLines","obj":"Sales-Post","tables":["Sales Line","Item Ledger Entry"]},{"d":2,"type":"call","proc":"CheckCreditLimit","obj":"Customer Mgt.","tables":["Customer"]},{"d":1,"type":"event","name":"OnAfterPostDocument","subs":3},{"d":2,"type":"sub","proc":"HandlePostDoc","obj":"My Extension","tables":["Custom Log"]}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-intercept"
mcp_tool = "al/intercept"
cli_command = "al intercept --json"
description = "Find integration/business events where an extension can intercept and alter behavior"
args = "<object> [--field <name>] [--proc <name>]"

[schemas.notes]
field_filter = "Filters to events whose parameters include that field's table"
proc_filter = "Filters to events published within that procedure"
focus = "Only events with var parameters (modifiable by subscriber) are surfaced"

[schemas.output]
format = "object"
fields = [
  { name = "object", type = "string", description = "Object name" },
  { name = "events", type = "array",  description = "Interceptable events" },
]

[schemas.output.events_item]
fields = [
  { name = "name",   type = "string", description = "Event name" },
  { name = "type",   type = "string", description = "'integration' or 'business'" },
  { name = "proc",   type = "string", description = "Procedure that publishes this event" },
  { name = "l",      type = "int",    description = "1-based line" },
  { name = "params", type = "array",  description = "Parameter declarations (strings)" },
  { name = "note",   type = "string", description = "Explanation of how to use var params" },
]

[schemas.example]
json = '{"object":"Sales-Post","events":[{"name":"OnBeforePostSalesDoc","type":"integration","proc":"PostDocument","l":120,"params":["var SalesHeader: Record \"Sales Header\"","var IsHandled: Boolean"],"note":"var params — subscriber can modify SalesHeader or set IsHandled to skip default logic"},{"name":"OnAfterCheckCreditLimit","type":"business","proc":"CheckCreditLimit","l":340,"params":["Customer: Record Customer","var CreditOK: Boolean"],"note":"var CreditOK — subscriber can override credit check result"}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-subscribers"
mcp_tool = "al/subscribers"
cli_command = "al subscribers --json"
description = "All subscribers to events published by this object, grouped by event"
args = "<object>"

[schemas.output]
format = "object"
fields = [
  { name = "publisher", type = "object", description = "The event-publishing object" },
  { name = "events",    type = "array",  description = "Events with their subscriber lists" },
]

[schemas.output.publisher_fields]
fields = [
  { name = "k",  type = "string", description = "Object kind" },
  { name = "id", type = "int",    description = "Object ID" },
  { name = "n",  type = "string", description = "Object name" },
]

[schemas.output.events_item]
fields = [
  { name = "name", type = "string", description = "Event name" },
  { name = "type", type = "string", description = "'integration' or 'business'" },
  { name = "subs", type = "array",  description = "Subscriber entries (may be empty array)" },
]

[schemas.output.subs_item]
fields = [
  { name = "k",    type = "string",      description = "Object kind" },
  { name = "id",   type = "int",         description = "Object ID" },
  { name = "n",    type = "string",      description = "Object name" },
  { name = "proc", type = "string",      description = "Subscriber procedure name" },
  { name = "f",    type = "string|null", description = "File path (null = package)" },
  { name = "l",    type = "int|null",    description = "1-based line (null = package)" },
  { name = "pkg",  type = "string",      description = "Package name or 'workspace'" },
]

[schemas.example]
json = '{"publisher":{"k":"Codeunit","id":80,"n":"Sales-Post"},"events":[{"name":"OnAfterPostDocument","type":"integration","subs":[{"k":"Codeunit","id":50100,"n":"My Extension","proc":"OnAfterPost","f":"src/MyExt.al","l":32,"pkg":"workspace"},{"k":"Codeunit","id":1535,"n":"Approvals Mgmt","proc":"OnAfterPostSalesDoc","pkg":"Base Application"}]},{"name":"OnBeforePostLines","type":"integration","subs":[]}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-debug"
mcp_tool = "al/debug"
cli_command = "al debug --json"
description = "Headless debugger control (compile → EditorServices.Host → DAP)"
args = "<subcommand> [options]"

[schemas.subcommands]
start = "al debug start [--config <name>]"
breakpoint_set = "al debug breakpoint <file> <line> [--condition <expr>]"
breakpoint_clear = "al debug breakpoint --clear [--all]"
state = "al debug state"
eval = "al debug eval <expr>"
continue_ = "al debug continue"
step = "al debug step [over|into|out]"
history = "al debug history [--var <name>]"
stop = "al debug stop"

[schemas.notes]
history_var_filter = "--var filter on history returns only snapshots where that variable changed"
token_budget = "~100 tokens for state, ~150 for history with 3 hits"

[schemas.output.start_async_initial]
description = "Immediate response while compiling"
json = '{"cmd":"start","config":"default","status":"compiling"}'

[schemas.output.start_async_final]
description = "Async response when session is running"
json = '{"cmd":"start","status":"running","session":"s1","pid":12345}'

[schemas.output.start_fields]
fields = [
  { name = "cmd",     type = "string", description = "'start'" },
  { name = "config",  type = "string", description = "Launch config name" },
  { name = "status",  type = "string", description = "'compiling' | 'running'" },
  { name = "session", type = "string", description = "Session ID (running only)" },
  { name = "pid",     type = "int",    description = "Process ID (running only)" },
]

[schemas.output.breakpoints]
description = "Set breakpoints response"
json = '''{"cmd":"breakpoints","set":[{"f":"src/SalesProcessor.al","l":32,"id":"bp1"},{"f":"src/SalesProcessor.al","l":55,"id":"bp2","condition":"SalesHeader.\"No.\" = \'S-1001\'"}]}'''

[schemas.output.breakpoints_item]
fields = [
  { name = "f",         type = "string", description = "File path" },
  { name = "l",         type = "int",    description = "1-based line" },
  { name = "id",        type = "string", description = "Breakpoint ID" },
  { name = "condition", type = "string", description = "Conditional expression (omitted if unconditional)" },
]

[schemas.output.state]
description = "Current debugger state (paused at breakpoint)"
json = '{"cmd":"state","session":"s1","status":"paused","location":{"f":"src/SalesProcessor.al","l":32,"proc":"PostDocument"},"stack":[{"frame":0,"proc":"PostDocument","obj":"Sales Processor","f":"src/SalesProcessor.al","l":32},{"frame":1,"proc":"OnRun","obj":"Sales Processor","f":"src/SalesProcessor.al","l":5}],"vars":[{"name":"SalesHeader","type":"Record \"Sales Header\"","fields":[{"n":"No.","v":"S-1001"},{"n":"Posting Date","v":"2026-03-13"},{"n":"Status","v":"Open"}]},{"name":"IsHandled","type":"Boolean","v":"false"},{"name":"LineCount","type":"Integer","v":"3"}]}'

[schemas.output.state_fields]
fields = [
  { name = "cmd",      type = "string", description = "'state'" },
  { name = "session",  type = "string", description = "Session ID" },
  { name = "status",   type = "string", description = "'paused' | 'running' | 'stopped'" },
  { name = "location", type = "object", description = "Current pause location: {f, l, proc}" },
  { name = "stack",    type = "array",  description = "Call stack frames: [{frame, proc, obj, f, l}]" },
  { name = "vars",     type = "array",  description = "Local variables: [{name, type, v?, fields?}]" },
]

[schemas.output.eval]
description = "Expression evaluation at current frame"
json = '{"cmd":"eval","expr":"SalesHeader.\"Sell-to Customer No.\"","result":{"type":"Code[20]","v":"C-10000"}}'

[schemas.output.continue_]
description = "Resume execution"
json = '{"cmd":"continue","status":"paused","location":{"f":"src/SalesProcessor.al","l":55,"proc":"PostDocument"}}'

[schemas.output.step]
description = "Step execution"
json = '{"cmd":"step","type":"over","status":"paused","location":{"f":"src/SalesProcessor.al","l":33,"proc":"PostDocument"}}'

[schemas.output.history]
description = "Recorded snapshots at each breakpoint hit"
json = '{"cmd":"history","session":"s1","hits":[{"seq":1,"bp":"bp1","time":"14:32:01.123","location":{"f":"src/SalesProcessor.al","l":32,"proc":"PostDocument"},"vars":[{"name":"SalesHeader.\"No.\"","v":"S-1001"},{"name":"IsHandled","v":"false"}]},{"seq":2,"bp":"bp2","time":"14:32:01.456","location":{"f":"src/SalesProcessor.al","l":55,"proc":"PostDocument"},"vars":[{"name":"SalesHeader.\"No.\"","v":"S-1001"},{"name":"LineCount","v":"3"}]},{"seq":3,"bp":"bp1","time":"14:32:02.789","location":{"f":"src/SalesProcessor.al","l":32,"proc":"PostDocument"},"vars":[{"name":"SalesHeader.\"No.\"","v":"S-1002"},{"name":"IsHandled","v":"false"}]}]}'

[schemas.output.history_fields]
fields = [
  { name = "cmd",     type = "string", description = "'history'" },
  { name = "session", type = "string", description = "Session ID" },
  { name = "hits",    type = "array",  description = "Breakpoint hit snapshots: [{seq, bp, time, location, vars}]" },
]

[schemas.output.stop]
description = "Stop session"
json = '{"cmd":"stop","session":"s1","status":"stopped","hits":3}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "/al-lint"
mcp_tool = "al/lint"
cli_command = "al lint --json"
description = "File or workspace diagnostics"
args = "[<file>] [--all] [--semantic]"

[schemas.notes]
semantic_flag = "--semantic invokes .NET CodeAnalysis bridge (requires ALTool)"

[schemas.output]
format = "object"
fields = [
  { name = "files", type = "array", description = "Files with diagnostics" },
]

[schemas.output.files_item]
fields = [
  { name = "f",     type = "string", description = "File path" },
  { name = "diags", type = "array",  description = "Diagnostics in this file" },
]

[schemas.output.diags_item]
fields = [
  { name = "l",    type = "int",    description = "1-based line" },
  { name = "c",    type = "int",    description = "1-based column" },
  { name = "sev",  type = "string", description = "'error' | 'warn' | 'info' | 'hint'" },
  { name = "code", type = "string", description = "Diagnostic code (e.g. 'AL0604')" },
  { name = "msg",  type = "string", description = "Human-readable message" },
]

[schemas.example]
json = '''{"files":[{"f":"src/MySub.al","diags":[{"l":32,"c":5,"sev":"warn","code":"AL0604","msg":"Use of implicit \'with\' is deprecated"},{"l":45,"c":1,"sev":"error","code":"AA0005","msg":"Missing documentation comment"}]}]}'''

# ─── CLI Command Schemas (actual daemon JSON output) ──────────────────────────
# NOTE: These reflect ACTUAL serde serialization output, not the compact
# abbreviated format used in the slash command schemas above. The slash command
# schemas describe the intended MCP output format (abbreviated for token density).

[[schemas]]
command = "al search --json"
mcp_tool = "al/search"
description = "Search workspace and package symbols"
args = "<query> [--limit N]"

[schemas.output]
format = "array"
note = "Returns serialized Vec<SymbolEntry>. Only non-default fields are included."
fields = [
  { name = "kind",    type = "string",      description = "Object kind (Table, Page, Codeunit, ...)" },
  { name = "id",      type = "int",         description = "Object ID" },
  { name = "name",    type = "string",      description = "Symbol name" },
  { name = "package", type = "string",      description = "Package name or '(workspace)'" },
  { name = "extends", type = "string|null", description = "Extended object (extensions only)" },
  { name = "methods", type = "array",       description = "Procedures (omitted when empty)" },
  { name = "fields",  type = "array",       description = "Fields (omitted when empty)" },
]

[schemas.example]
json = '[{"kind":"Table","id":18,"name":"Customer","package":"Base Application"},{"kind":"Page","id":21,"name":"Customer Card","package":"Base Application"}]'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al hover --json"
mcp_tool = "al/hover"
description = "Hover information at a source position"
args = "<file> <line> <col>"

[schemas.output]
format = "object"
fields = [
  { name = "contents", type = "object", description = "LSP MarkupContent (kind + value)" },
  { name = "range",    type = "object|null", description = "LSP Range (start/end with line/character)" },
]

[schemas.example]
json = '{"contents":{"kind":"markdown","value":"**Table** 18 **Customer**"},"range":{"start":{"line":0,"character":5},"end":{"line":0,"character":13}}}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al definition --json"
mcp_tool = "al/definition"
description = "Go to definition for a symbol at a source position"
args = "<file> <line> <col>"

[schemas.output]
format = "array"
note = "Returns array of LSP Location objects (uri + range)"
fields = [
  { name = "uri",   type = "string", description = "File URI" },
  { name = "range", type = "object", description = "LSP Range (start/end with line/character)" },
]

[schemas.example]
json = '[{"uri":"file:///src/Customer.al","range":{"start":{"line":0,"character":0},"end":{"line":0,"character":30}}}]'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al references --json"
mcp_tool = "al/references"
description = "Find all references to a symbol at a source position"
args = "<file> <line> <col>"

[schemas.output]
format = "array"
note = "Returns array of LSP Location objects (uri + range)"
fields = [
  { name = "uri",   type = "string", description = "File URI" },
  { name = "range", type = "object", description = "LSP Range (start/end with line/character)" },
]

[schemas.example]
json = '[{"uri":"file:///src/SalesHeader.al","range":{"start":{"line":44,"character":11},"end":{"line":44,"character":19}}}]'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al completions --json"
description = "Completion items at a source position"
args = "<file> <line> <col>"

[schemas.output]
format = "array"
fields = [
  { name = "label",    type = "string",      description = "Display label" },
  { name = "kind",     type = "string",      description = "Symbol kind (e.g. 'Field', 'Method')" },
  { name = "detail",   type = "string|null", description = "Short detail string" },
  { name = "sortText", type = "string|null", description = "Sort ordering text" },
]

[schemas.example]
json = '[{"label":"Customer","kind":"Field","detail":"Record","sortText":"00Customer"}]'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al compile --json"
description = "Compile the AL project via semantic bridge"
args = ""

[schemas.output]
format = "object"
fields = [
  { name = "success",     type = "bool",        description = "Whether compilation succeeded" },
  { name = "diagnostics", type = "array",       description = "Compiler diagnostics" },
  { name = "appPath",     type = "string|null", description = "Path to produced .app file (null on failure)" },
]

[schemas.output.diagnostics_item]
fields = [
  { name = "file",      type = "string", description = "Source file path" },
  { name = "line",      type = "int",    description = "Line number" },
  { name = "column",    type = "int",    description = "Column number" },
  { name = "endLine",   type = "int",    description = "End line" },
  { name = "endColumn", type = "int",    description = "End column" },
  { name = "severity",  type = "string", description = "error, warning, or info" },
  { name = "code",      type = "string", description = "Diagnostic code (e.g. AL0001)" },
  { name = "message",   type = "string", description = "Diagnostic message" },
]

[schemas.example]
json = '{"success":true,"diagnostics":[],"appPath":"/project/MyPub_MyApp_1.0.0.0.app"}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al obsolete --json"
description = "Find obsolete symbols in workspace"
args = ""

[schemas.output]
format = "array"
note = "Returns serialized Vec<ObsoleteEntry> with camelCase fields"
fields = [
  { name = "object",      type = "string",      description = "Object name containing the symbol" },
  { name = "symbol",      type = "string",      description = "Symbol name" },
  { name = "kind",        type = "string",      description = "Symbol kind (object, procedure, field)" },
  { name = "state",       type = "string",      description = "pending or removed" },
  { name = "reason",      type = "string|null", description = "ObsoleteReason text" },
  { name = "tag",         type = "string|null", description = "ObsoleteTag (version or date)" },
  { name = "file",        type = "string|null", description = "File path (workspace only)" },
  { name = "line",        type = "int|null",    description = "1-based line number" },
  { name = "callerCount", type = "int",         description = "Number of references found" },
]

[schemas.example]
json = '[{"object":"Sales Header","symbol":"PostDocument","kind":"procedure","state":"pending","reason":"Use PostSalesDoc instead","tag":"26.0","callerCount":3}]'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al duplicates --json"
description = "Find duplicate/similar code blocks"
args = "[--min-tokens N] [--min-similarity F]"

[schemas.output]
format = "array"
note = "Returns serialized Vec<DuplicateBlock> with camelCase fields"
fields = [
  { name = "first",      type = "object", description = "First occurrence location" },
  { name = "second",     type = "object", description = "Second occurrence location" },
  { name = "similarity", type = "float",  description = "Similarity score 0.0-1.0" },
  { name = "tokenCount", type = "int",    description = "Number of tokens in common" },
]

[schemas.output.location_fields]
fields = [
  { name = "file",      type = "string", description = "File path" },
  { name = "object",    type = "string", description = "Object name" },
  { name = "procedure", type = "string", description = "Procedure name" },
  { name = "line",      type = "int",    description = "1-based line number" },
]

[schemas.example]
json = '[{"first":{"file":"src/A.al","object":"CU1","procedure":"Validate","line":10},"second":{"file":"src/B.al","object":"CU2","procedure":"Check","line":20},"similarity":0.92,"tokenCount":35}]'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al entrypoints --json"
description = "Find entry point procedures (no callers)"
args = ""

[schemas.output]
format = "array"
note = "Returns serialized Vec<InsightNode> with serde tag='type'"
fields = [
  { name = "type",        type = "string", description = "Node type: Object, Procedure, Event, Subscriber" },
  { name = "object_name", type = "string", description = "Object containing the procedure" },
  { name = "name",        type = "string", description = "Procedure/event name" },
  { name = "object_kind", type = "string", description = "Object kind (Table, Page, Codeunit, ...)" },
  { name = "is_local",    type = "bool",   description = "Whether procedure is local (Procedure type only)" },
]

[schemas.example]
json = '[{"type":"Procedure","object_kind":"Codeunit","object_name":"Sales-Post","name":"PostDocument","is_local":false}]'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al fix --json"
description = "Apply auto-fixes for lint issues"
args = "[<file>] [--dry-run] [--rule <code>] [--all]"

[schemas.notes]
dry_run = "--dry-run: show what would be changed without applying"
rule_filter = "--rule CODE: only fixes for that diagnostic code"

[schemas.output]
format = "object"
fields = [
  { name = "fixes", type = "array", description = "Fixes applied (or planned in dry-run)" },
]

[schemas.output.fixes_item]
fields = [
  { name = "f",      type = "string", description = "File path" },
  { name = "l",      type = "int",    description = "1-based line" },
  { name = "code",   type = "string", description = "Diagnostic code being fixed" },
  { name = "action", type = "string", description = "Fix action type (e.g. 'replace')" },
  { name = "old",    type = "string", description = "Original text" },
  { name = "new",    type = "string", description = "Replacement text" },
]

[schemas.example]
json = '{"fixes":[{"f":"src/MySub.al","l":32,"code":"AL0604","action":"replace","old":"with Customer do","new":"Customer.\"No.\""}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al deps --json"
mcp_tool = "al/deps"
description = "Dependency graph for the current workspace app (CLI variant)"
args = ""

[schemas.output]
format = "object"
fields = [
  { name = "app",        type = "string", description = "Current app name" },
  { name = "deps",       type = "array",  description = "Direct dependencies: [{n, v, direct}]" },
  { name = "transitive", type = "array",  description = "Transitive dependencies: [{n, v}]" },
]

[schemas.example]
json = '{"app":"My Extension","deps":[{"n":"Base Application","v":"26.0.0.0","direct":true}],"transitive":[{"n":"System","v":"26.0.0.0"}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al metrics --json"
mcp_tool = "al/metrics"
description = "Code complexity metrics per procedure"
args = "[<file>]"

[schemas.output]
format = "object"
fields = [
  { name = "files", type = "array", description = "Files with metrics" },
]

[schemas.output.files_item]
fields = [
  { name = "f",     type = "string", description = "File path" },
  { name = "procs", type = "array",  description = "Per-procedure metrics" },
]

[schemas.output.procs_item]
fields = [
  { name = "n",          type = "string", description = "Procedure name" },
  { name = "lines",      type = "int",    description = "Line count" },
  { name = "cyclomatic", type = "int",    description = "Cyclomatic complexity" },
  { name = "cognitive",  type = "int",    description = "Cognitive complexity" },
  { name = "calls",      type = "int",    description = "Number of call sites" },
]

[schemas.example]
json = '{"files":[{"f":"src/SalesPost.al","procs":[{"n":"PostDocument","lines":85,"cyclomatic":12,"cognitive":18,"calls":7},{"n":"ValidateHeader","lines":20,"cyclomatic":3,"cognitive":4,"calls":2}]}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al impact --json"
mcp_tool = "al/impact"
description = "What objects are impacted by a given symbol (field, procedure, etc.)"
args = "<symbol>"

[schemas.output]
format = "object"
fields = [
  { name = "symbol",    type = "string", description = "Symbol reference queried" },
  { name = "impacted",  type = "array",  description = "Impacted objects" },
]

[schemas.output.impacted_item]
fields = [
  { name = "k",        type = "string", description = "Object kind" },
  { name = "id",       type = "int",    description = "Object ID" },
  { name = "n",        type = "string", description = "Object name" },
  { name = "field",    type = "string", description = "Field name (pages/reports)" },
  { name = "proc",     type = "string", description = "Procedure name (codeunits)" },
  { name = "l",        type = "int",    description = "1-based line (when available)" },
  { name = "dataitem", type = "string", description = "DataItem name (reports)" },
  { name = "type",     type = "string", description = "Impact type: 'read' | 'write' | 'display' | 'filter'" },
]

[schemas.example]
json = '{"symbol":"Customer.\"Credit Limit\"","impacted":[{"k":"Page","id":21,"n":"Customer Card","field":"Credit Limit (LCY)","type":"display"},{"k":"Codeunit","id":80,"n":"Sales-Post","proc":"CheckCreditLimit","l":340,"type":"read"},{"k":"Report","id":111,"n":"Customer - Top 10","dataitem":"Customer","type":"filter"}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al dead-code --json"
mcp_tool = "al/dead-code"
description = "Find unused procedures, fields, and subscribers"
args = ""

[schemas.output]
format = "object"
fields = [
  { name = "unused", type = "array", description = "Unused code items" },
]

[schemas.output.unused_item]
fields = [
  { name = "k",      type = "string", description = "'procedure' | 'field' | 'subscriber'" },
  { name = "n",      type = "string", description = "Name of the unused item" },
  { name = "id",     type = "int",    description = "Field ID (fields only)" },
  { name = "obj",    type = "string", description = "Containing object name" },
  { name = "f",      type = "string", description = "File path" },
  { name = "l",      type = "int",    description = "1-based line" },
  { name = "reason", type = "string", description = "Why it is considered unused" },
]

[schemas.example]
json = '{"unused":[{"k":"procedure","n":"OldHelper","obj":"My Codeunit","f":"src/MyCU.al","l":120,"reason":"zero references"},{"k":"field","id":50100,"n":"Legacy Flag","obj":"My Table","f":"src/MyTable.al","l":45,"reason":"zero references"},{"k":"subscriber","n":"OnOldEvent","obj":"My Sub","f":"src/MySub.al","l":80,"reason":"publisher removed in BC26"}]}'

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al suggest-event --json"
mcp_tool = "al/suggest-event"
description = "Given a business scenario, suggest event publisher/subscriber patterns"
args = "<description>"

[schemas.output]
format = "object"
fields = [
  { name = "query",       type = "string", description = "The input description" },
  { name = "suggestions", type = "array",  description = "Ranked event suggestions" },
]

[schemas.output.suggestions_item]
fields = [
  { name = "event",   type = "string", description = "Event name" },
  { name = "obj",     type = "string", description = "Publishing object name" },
  { name = "type",    type = "string", description = "'integration' or 'business'" },
  { name = "params",  type = "array",  description = "Parameter declarations (strings)" },
  { name = "why",     type = "string", description = "Explanation of why this event fits the scenario" },
  { name = "example", type = "string", description = "Ready-to-paste [EventSubscriber(...)] attribute" },
]

[schemas.example]
json = '''{"query":"validate customer credit limit on sales order","suggestions":[{"event":"OnBeforePostSalesDoc","obj":"Sales-Post","type":"integration","params":["var SalesHeader: Record \"Sales Header\"","var IsHandled: Boolean"],"why":"Fires before posting — subscriber can validate and set IsHandled to block","example":"[EventSubscriber(ObjectType::Codeunit, Codeunit::\"Sales-Post\", \'OnBeforePostSalesDoc\', \'\', false, false)]"},{"event":"OnAfterCheckCreditLimit","obj":"Cust. Check Cr. Limit","type":"business","params":["Customer: Record Customer","var CreditOK: Boolean"],"why":"Fires after standard credit check — subscriber can override result via var CreditOK","example":"[EventSubscriber(ObjectType::Codeunit, Codeunit::\"Cust. Check Cr. Limit\", \'OnAfterCheckCreditLimit\', \'\', false, false)]"}]}'''

# ─────────────────────────────────────────────────────────────────────────────

[[schemas]]
command = "al permissions --json"
mcp_tool = "al/permissions"
description = "Generate permission set for the workspace app"
args = "[--format al|xml]"

[schemas.notes]
formats = "'al' = AL permissionset object | 'xml' = legacy XML format"

[schemas.output]
format = "object"
fields = [
  { name = "format",  type = "string", description = "'al' or 'xml'" },
  { name = "content", type = "string", description = "Generated permission set source" },
]

# ─────────────────────────────────────────────────────────────────────────────
# MCP Tool Registration Reference
# All MCP tools share schemas with their CLI counterparts above.
# ─────────────────────────────────────────────────────────────────────────────

[mcp_tools]
description = "MCP tool names and their corresponding CLI command schemas"
mapping = [
  { tool = "al/search",       cli = "al search --json" },
  { tool = "al/object",       cli = "al object --json" },
  { tool = "al/source",       cli = "al source --json" },
  { tool = "al/events",       cli = "al events --json (/al-events)" },
  { tool = "al/hover",        cli = "al hover --json" },
  { tool = "al/definition",   cli = "al definition --json" },
  { tool = "al/references",   cli = "al references --json" },
  { tool = "al/lint",         cli = "al lint --json (/al-lint)" },
  { tool = "al/trace",        cli = "al trace --json (/al-trace)" },
  { tool = "al/impact",       cli = "al impact --json" },
  { tool = "al/metrics",      cli = "al metrics --json" },
  { tool = "al/tables",       cli = "al tables --json (/al-tables)" },
  { tool = "al/callgraph",    cli = "al callgraph --json (/al-callgraph)" },
  { tool = "al/intercept",    cli = "al intercept --json (/al-intercept)" },
  { tool = "al/subscribers",  cli = "al subscribers --json (/al-subscribers)" },
  { tool = "al/debug",        cli = "al debug --json (/al-debug)" },
  { tool = "al/dead-code",    cli = "al dead-code --json" },
  { tool = "al/suggest-event", cli = "al suggest-event --json" },
  { tool = "al/permissions",  cli = "al permissions --json" },
  { tool = "al/deps",         cli = "al deps --json (/al-deps)" },
]

[mcp_tools.input_schemas]
note = "MCP input schemas (properties + required fields) — responses use the CLI --json schemas above"

[mcp_tools.input_schemas.search]
properties = '{"query":{"type":"string"},"kind":{"type":"string","enum":["Table","Page","Codeunit","Report","Query","Enum","Interface"]}}'
required = []

[mcp_tools.input_schemas.object]
properties = '{"name":{"type":"string"},"kind":{"type":"string"}}'
required = ["name"]

[mcp_tools.input_schemas.source]
properties = '{"name":{"type":"string"},"kind":{"type":"string"},"proc":{"type":"string"},"trigger":{"type":"string"}}'
required = ["name"]

[mcp_tools.input_schemas.events]
properties = '{"name":{"type":"string"}}'
required = ["name"]

[mcp_tools.input_schemas.hover]
properties = '{"file":{"type":"string"},"line":{"type":"integer"},"col":{"type":"integer"}}'
required = ["file", "line", "col"]

[mcp_tools.input_schemas.definition]
properties = '{"file":{"type":"string"},"line":{"type":"integer"},"col":{"type":"integer"}}'
required = ["file", "line", "col"]

[mcp_tools.input_schemas.references]
properties = '{"file":{"type":"string"},"line":{"type":"integer"},"col":{"type":"integer"}}'
required = ["file", "line", "col"]

[mcp_tools.input_schemas.lint]
properties = '{"file":{"type":"string"},"all":{"type":"boolean"}}'
required = []

[mcp_tools.input_schemas.trace]
properties = '{"file":{"type":"string"},"line":{"type":"integer"}}'
required = ["file", "line"]

[mcp_tools.input_schemas.impact]
properties = '{"symbol":{"type":"string"}}'
required = ["symbol"]

[mcp_tools.input_schemas.metrics]
properties = '{"file":{"type":"string"}}'
required = []

[mcp_tools.input_schemas.tables]
properties = '{"name":{"type":"string"},"proc":{"type":"string"}}'
required = ["name"]

[mcp_tools.input_schemas.callgraph]
properties = '{"name":{"type":"string"},"proc":{"type":"string"},"depth":{"type":"integer","default":3,"maximum":10}}'
required = ["name"]

[mcp_tools.input_schemas.intercept]
properties = '{"name":{"type":"string"},"field":{"type":"string"},"proc":{"type":"string"}}'
required = ["name"]

[mcp_tools.input_schemas.subscribers]
properties = '{"name":{"type":"string"}}'
required = ["name"]

[mcp_tools.input_schemas.debug]
properties = '{"cmd":{"type":"string","enum":["start","breakpoint","state","eval","continue","step","history","stop"]},"file":{"type":"string"},"line":{"type":"integer"},"condition":{"type":"string"},"expr":{"type":"string"},"step_type":{"type":"string","enum":["over","into","out"]},"var":{"type":"string"},"config":{"type":"string"}}'
required = ["cmd"]

[mcp_tools.input_schemas.dead_code]
properties = '{}'
required = []

[mcp_tools.input_schemas.suggest_event]
properties = '{"description":{"type":"string"}}'
required = ["description"]

[mcp_tools.input_schemas.permissions]
properties = '{"format":{"type":"string","enum":["al","xml"]}}'
required = []
