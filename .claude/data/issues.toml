[[issues]]
id = "ISSUE-024"
title = "UTF-16 position bug — character offset treated as char index in documents.rs"
type = "architecture"
reporter = "prod-readiness audit"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
status = "open"
triage = "STOP"
description = """
crates/al-lsp/src/documents.rs position_to_offset() treats the LSP `character` field as a
Unicode scalar (char) offset: `Some(line_start + character as usize)`. The LSP spec defines
character as UTF-16 code units. For any file containing non-BMP characters (emoji, CJK
supplementary), positions will be wrong — edits will corrupt document text, hover/completion
will resolve the wrong location.

Additionally, the server advertises TextDocumentSyncKind::INCREMENTAL (server.rs:279) but
zed-fidelity.md states Zed uses Full sync. The INCREMENTAL capability combined with the
UTF-16 bug means any non-Zed client sending real incremental edits will get document corruption.
The sync kind should be changed to FULL to match actual behavior, or the UTF-16 handling must
be fixed properly.
"""

[[issues]]
id = "ISSUE-025"
title = "did_change runs bridge diagnostics synchronously per keystroke — blocks LSP"
type = "architecture"
reporter = "prod-readiness audit"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "HIGH"
status = "open"
triage = "STOP"
description = """
crates/al-lsp/src/server.rs:370-391 — the did_change handler calls publish_diagnostics
inline, which includes Phase 2 bridge calls (up to BRIDGE_INTERACTIVE_TIMEOUT = 5s). This
runs for every keystroke. During a slow bridge call, the LSP server is unresponsive to
hover, completion, and other requests.

Fix: spawn publish_diagnostics into a separate task with debouncing, cancel the previous
pending diagnostic task on each new keystroke.
"""

