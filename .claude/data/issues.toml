[[issues]]
id = "deferred-dead-code-find-variable-references-name-collision"
title = "find_variable_references() causes false negatives for procedures/fields with common names"
type = "deferred"
reporter = "adversarial"
date = ""
category = "plan"
severity = "bug"
priority = "MEDIUM"
status = "open"
blocking_task = "dead-code-feature-followup"
file = "crates/al-core/src/queries/dead_code.rs"
reason = "Requires a smarter reference-counting approach: either scope-aware AST analysis or tracking qualified references (Object.ProcedureName). Architectural change needed in al-syntax or a new dedicated pass in dead_code.rs."
description = """
find_variable_references() matches identifier/quoted_identifier/name nodes case-insensitively.
For procedure detection, a procedure named 'Name' could match ANY 'Name' token in the file
(including parameter names, record field access like Rec.Name, etc.). This causes false
negatives: procedures with short common names like 'Init', 'Name', 'Code', 'Post' would
never be flagged as unused because they match ubiquitous identifiers elsewhere.

Similarly for table field detection: a field named 'Status' would appear in many other
AL files as a local variable or different field reference, so it would never appear unused.

The root cause is that find_variable_references is designed for local variable references
within a procedure scope, not for cross-file symbol reference counting.
"""

[[issues]]
id = "deferred-symbol-cache-concurrent-process-rename-race"
title = "Concurrent daemon processes can clobber the same .tmp cache file"
type = "deferred"
reporter = "adversarial"
date = ""
category = "constraint"
severity = "bug"
priority = "LOW"
status = "open"
blocking_task = "T801-followup"
file = "crates/al-symbols/src/cache.rs"
reason = "Benign on Linux due to atomic rename and identical content. Fixing the Windows case and tmp cleanup requires either a per-process unique tmp filename (e.g. using PID or random suffix) or a file lock. Defer until Windows support is needed."
description = """
The atomic write (write to .tmp then rename) prevents partial writes within one process,
but does not handle the case of two daemon processes starting simultaneously with the same
project path. Both will get a cache miss for the same .app file, both will parse it, and
both will write to the same .tmp path and rename to the same .cache path. On Linux,
rename(2) is atomic so the last rename wins cleanly. However, both processes independently
wrote a .tmp file to the same path — the second fs::write to .tmp silently clobbers the
first process's .tmp, and then the second rename is a no-op if the first already completed.
In practice this is benign on Linux (both processes write identical data), but on Windows
rename is not atomic and could corrupt the cache file. Also, the .tmp file from a crashed
process is never cleaned up.
"""

