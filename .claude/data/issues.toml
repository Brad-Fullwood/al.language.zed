[[issues]]
id = "ISSUE-064"
title = "Two al-syntax unit tests fail: test_extract_symbols_enum and test_extract_symbols_report_dataitem_trigger"
type = "architecture"
reporter = "user"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "HIGH"
status = "fixed"
triage = "PARALLEL"
resolution = """
Root causes (found by inspecting the tree-sitter AST):

1. Enum values: The grammar parses `value(0; "First") { }` as `object_section` with
   keyword="value", not as `enum_value_declaration`. `extract_section_symbol()` had no case
   for "value" and fell through to SymbolKind::NAMESPACE. Fixed by detecting keyword=="value"
   in `extract_section_symbol()` and delegating to a new `extract_enum_value_from_section()`
   helper that reads the name from the parenthesized block and returns SymbolKind::ENUM_MEMBER.

2. Report dataitem triggers: The grammar parses `dataitem(StagingRec; ...)` as a
   `key_declaration` node (not a page-control metadata_keyword). Inside that node's
   braced_block, `trigger OnPreDataItem()` is raw tokens (control_keyword + identifier),
   not a `trigger_declaration`. The existing `extract_triggers_from_braced_block()` helper
   already scanned for that pattern but was only called from `try_extract_page_control()`.
   Fixed by:
   - Adding `is_dataitem_key_declaration()` to detect key_declaration nodes with keyword="dataitem"
   - Adding `extract_dataitem_symbol()` that extracts the alias name and scans the body
     braced_block for raw trigger tokens via `extract_triggers_from_braced_block()`
   - Routing `key_declaration` nodes in `extract_section_body_children()` through
     `extract_dataitem_symbol()` when the keyword is "dataitem"

All 118 unit tests and 36 integration tests in al-syntax pass. Full workspace test suite passes.
"""
description = """
Two unit tests in crates/al-syntax/src/symbols.rs fail:

1. test_extract_symbols_enum: asserts SymbolKind::EnumMember but gets SymbolKind::Namespace.
   The extract_document_symbols() function classifies enum value children incorrectly.

2. test_extract_symbols_report_dataitem_trigger: expects OnPreDataItem trigger to appear in
   document symbols but it's missing from the output. Got: ["IJL Process Staging", "dataset",
   "StagingRec", "OnPostReport", "SetAction"]. The report dataitem trigger extraction logic
   is not finding trigger_declaration nodes inside dataitem blocks.

Both failures are pre-existing (present before any issue-fixer changes). Likely caused by
recent changes to extract_document_symbols() that altered how enum members and report
dataitem triggers are classified/discovered.
"""

