description = """
crates/al-mcp/src/main.rs — ServerHandler::get_info() returned a ServerInfo with no
server name or version. MCP clients rely on this for identification/logging. The default
Implementation::from_build_env() uses build-time package info but was not explicitly set.

Fixed: Added .with_server_info(Implementation::new("al-mcp", env!("CARGO_PKG_VERSION")))
to the get_info() chain, making the server identity explicit and user-controlled.
"""

[[issues]]
id = "ISSUE-046"
title = "OAuth tokens written world-readable (0o644 default permissions)"
type = "architecture"
reporter = "prod-readiness audit"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "HIGH"
status = "fixed"
triage = "PARALLEL"
description = """
crates/al-symbols/src/oauth.rs — save_cached_token() writes OAuth tokens via std::fs::write()
which uses the default umask (typically 0o644 — world-readable). OAuth tokens with long
expiry (Microsoft AAD default is 1 hour, refresh tokens much longer) stored world-readable
allow any process running as the same user to read them, but the issue is about shared/multi-user
environments and principle of least privilege.

Fixed: Replaced std::fs::write() with OpenOptions::new().mode(0o600) (Unix only) to set
owner-only read+write permissions atomically at file creation. Non-Unix platforms fall back
to standard OpenOptions without mode setting.
"""

