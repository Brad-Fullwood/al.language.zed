[[issues]]
id = "ISSUE-020"
title = "al-cli bypasses daemon for cache clearing and file walking"
type = "architecture"
reporter = "architecture audit"
date = "2026-03-15"
category = "constraint"
severity = "drift"
priority = "LOW"
status = "fixed"
triage = "SCHEDULE"
description = """
Two soft violations in al-cli: (1) `cmd_clear_cache` (main.rs:434-455) directly calls
`std::fs::remove_dir_all` on `~/.cache/al-lsp/packages/` without contacting the daemon —
encodes the daemon's internal cache layout. (2) `cmd_format_all` (main.rs:985-1021) walks the
filesystem itself to find `.al` files and sends one format request per file, rather than
sending `{"all": true}` and letting the daemon walk the project. Neither is a hard boundary
violation but both bypass the "one code path" principle.

Fixed: Documented as accepted soft violations in code-boundaries.md Adapter Patterns section.
These are practical trade-offs — cache clearing doesn't require a running daemon, and format-all
batching is a CLI convenience. No code change needed; docs updated to acknowledge the pattern.
"""

