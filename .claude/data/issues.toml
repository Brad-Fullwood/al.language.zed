[[issues]]
id = "ISSUE-009"
title = "code-boundaries.md and CLAUDE.md misrepresent al-lsp dependencies — BLOCKER"
type = "architecture"
reporter = "claude-md-improver audit"
date = "2026-03-15"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
status = "fixed"
