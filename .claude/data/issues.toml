[[issues]]
id = "ISSUE-065"
title = "29 tree-sitter-al externals unreferenced in grammar — breaks Zed highlights loading"
type = "architecture"
reporter = "user"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
status = "fixed"
triage = "STOP"
resolution = """
Updated tree-sitter-al/grammar.js to reference all 29 previously-unreferenced externals
in appropriate grammar rules. Ran `tree-sitter generate` to regenerate parser.c and
node-types.json. All 29 externals are now present as named nodes. Changes:

1. binary_operator: Added op_and, op_or, op_xor, op_mod, op_div, op_is, op_as as
   word-operator alternatives alongside existing operator_word / kw_in / operator choices.

2. statement + new rules: Added break_statement (wraps kw_break) and continue_statement
   (wraps kw_continue) as statement alternatives, matching kw_exit pattern.

3. enum_value_declaration: Changed keyword field from $.object_keyword to
   choice($.kw_value, $.object_keyword) so the `value(0; "Name")` keyword is named.

4. object_section keyword choice: Added kw_view, kw_views, kw_actionref, kw_customaction,
   kw_analysisview, kw_analysisviews, kw_fileuploadaction, kw_systemaction as explicit
   section keyword alternatives.

5. member_modifier: Added kw_indataset (report data item modifier).

6. name_or_keyword: Added kw_automation, kw_dotnetassembly, kw_dotnettypedeclaration,
   kw_program, kw_joker, kw_database, kw_none, kw_completiontriggererrorlevel,
   kw_connectiontype, kw_pageresult so they can appear as identifiers in property
   values, type references, and expressions.

7. _atom: Added all 29 externals so they can appear freely in braced/parenthesized/
   bracketed blocks anywhere in the parse tree.

Verification: python3 check confirms all 29 appear in node-types.json (283 named types
vs 252 before). cargo check --workspace --exclude zed-al: clean. cargo test -p al-syntax:
36/36 pass. Full workspace tests: all pass.
"""
description = """
tree-sitter-al grammar.js declares 29 externals (keywords + operators) that are never
referenced in any grammar rule. tree-sitter excludes unreferenced externals from
node-types.json. The highlights.scm query references these missing node types, causing
Zed to fail loading the AL language: "Invalid node type kw_analysisview".

Missing keywords (critical AL syntax):
- Operators: op_and, op_or, op_xor, op_mod, op_div, op_is, op_as
- Control flow: kw_break, kw_continue
- Object sections: kw_value, kw_view, kw_views, kw_actionref, kw_customaction,
  kw_analysisview, kw_analysisviews, kw_indataset, kw_fileuploadaction, kw_systemaction
- Legacy/rare: kw_automation, kw_dotnetassembly, kw_dotnettypedeclaration,
  kw_program, kw_joker, kw_database, kw_none, kw_completiontriggererrorlevel,
  kw_connectiontype, kw_pageresult

Fix: update the grammar rules in tree-sitter-al so these 29 externals are referenced
in the correct contexts. The al-gen templates in tree-sitter-al/generator/ need updating
so the generated grammar.js includes these keywords in the right grammar rules:
- Operators (op_and, op_or, etc.) → binary_expression / unary_expression rules
- Control flow (kw_break, kw_continue) → statement rules
- Object sections (kw_view, kw_actionref, etc.) → object_section / property rules
- Legacy (kw_automation, etc.) → evaluate case-by-case, include or remove from externals

Do NOT remove references from highlights.scm — the highlights are correct, the grammar
is incomplete.
"""

