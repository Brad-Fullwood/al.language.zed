description = """
Both CLAUDE.md and code-boundaries.md state al-lsp MAY import only `al-core, al-protocol`. In
reality al-lsp directly imports `al-dap-client` (unconditional) and `al-diag` (optional,
default-enabled). This means al-lsp bypasses al-core for DAP and diagnostics, violating the
