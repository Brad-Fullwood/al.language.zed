description = """
crates/al-symbols/src/app_reader.rs:91 — std::fs::read(path)? loads entire .app file into
Vec<u8> with no size check. Microsoft Base Application is ~50MB. A corrupted or crafted
2GB .app would cause OOM. Also, the NuGet extraction path has no size limit on embedded
.app files.

