Fixed: Added MAX_APP_FILE_SIZE constant (200 MB) and a size check in read_app_file() using
fs::metadata().len() before reading. Files exceeding the limit return AppReaderError::TooLarge.
The mmap SIGBUS race is a separate issue (not addressed here).
"""

