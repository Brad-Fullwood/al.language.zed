[[issues]]
id = "ISSUE-010"
title = "al-core / al-diag relationship misrepresented across all docs — BLOCKER"
type = "architecture"
reporter = "claude-md-improver audit"
date = "2026-03-15"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
status = "fixed"
triage = "STOP"
description = """
CLAUDE.md says al-core depends on al-diag. code-boundaries.md says al-core MAY import al-diag.
Neither is true — al-core has no al-diag dependency at all. Additionally, code-boundaries.md
says al-diag MAY import al-syntax — also false, al-diag depends on rusqlite and has zero al-*
dependencies. The entire documented relationship between al-core, al-diag, and al-syntax is
fictional. al-diag appears to be a standalone crate imported only by al-lsp (optionally).
The architecture needs to decide: should diagnostics route through al-core, or is the current
direct al-lsp→al-diag path intentional?

Fixed: Docs updated. al-core does NOT import al-diag (and the import rules table reflects this).
al-diag has zero al-* dependencies — rusqlite and tracing only. The direct al-lsp->al-diag path
is intentional (diag layer is optional). CLAUDE.md diagram, code-boundaries.md import table, and
block-core-boundaries hookify rule all updated to reflect reality.
"""

[[issues]]
id = "ISSUE-011"
title = "al-mcp doesn't follow stated adapter pattern — BLOCKER"
type = "architecture"
reporter = "claude-md-improver audit"
date = "2026-03-15"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
