date = "2026-03-15"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
status = "open"
triage = "STOP"
description = """
al-syntax (an analysis library that should be standalone) has a compile-time dependency on
`tower-lsp`, an LSP server framework. Usage is pervasive: `tower_lsp::lsp_types::{Position,
Range, DocumentSymbol, SymbolKind, FoldingRange, FoldingRangeKind}` across symbols.rs,
navigation.rs, folding.rs, context.rs, type_resolver.rs, lib.rs. Critically, `navigation.rs`
has `pub use tower_lsp::lsp_types::Position` — a re-export that makes the coupling viral to
every consumer of al-syntax. This means al-syntax cannot be used, tested, or depended upon
outside an LSP context without dragging the entire tower-lsp stack. Either: (a) define native
Position/Range types in al-syntax or al-protocol and convert at the al-lsp boundary, or (b)
accept the coupling and update the rules.
"""

