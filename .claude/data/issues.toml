[[issues]]
id = "ISSUE-056"
title = "Double parse on every did_open/did_change in al-lsp"
type = "simplify"
reporter = "simplify-review"
date = "2026-03-16"
category = "efficiency"
severity = "warning"
priority = "HIGH"
status = "fixed"
triage = "SERIAL"
resolution = """
Added AlParser::errors_from_tree(tree: &Tree) -> Vec<SyntaxError> public method in al-syntax/src/parser.rs
that extracts errors from an already-parsed tree via collect_errors_recursive.
Rewrote publish_diagnostics in al-lsp/src/diagnostics.rs (Phase 1) to call
al_core::parsing::get_or_parse which hits the document cache populated by update_workspace_index.
When the version matches (the common case on did_open/did_change), no re-parse occurs.
Uses AlParser::errors_from_tree to collect syntax errors from the cached tree.
Added a safe fallback path for the rare case where the document is not yet in the store.
"""
description = """
did_open calls update_workspace_index (which calls parse_quick and caches), then immediately calls
publish_diagnostics (which calls parse_quick again). The second parse is redundant.
Fix: publish_diagnostics should read from the cache populated by update_workspace_index.
"""

