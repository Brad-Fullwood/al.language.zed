description = """
.gitignore line 2 excluded /Cargo.lock. This workspace produces installable binaries
(al-lsp, al, al-explorer, al-mcp). Rust best practice is to commit Cargo.lock for binary
crates to ensure reproducible builds.

Fixed: Removed /Cargo.lock from .gitignore so the lock file will be tracked by git.
"""
