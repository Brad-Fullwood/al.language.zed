description = """
CLAUDE.md, thin-adapters.md, and code-boundaries.md all state al-mcp uses al-protocol and
connects to al-lsp via JSON-RPC. None of this is true. al-mcp has zero al-* crate dependencies
— it shells out to the `al` CLI binary at runtime. This means: (1) al-mcp depends on al-cli
