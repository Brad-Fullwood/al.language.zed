[[issues]]
id = "deferred-semantic-cache-subtype-stat-inflation"
title = "Subtype fallback pattern inflates cache miss counter in resolution.rs"
type = "deferred"
reporter = "adversarial"
date = ""
category = "rule"
severity = "bug"
priority = "LOW"
status = "open"
blocking_task = "T703-followup"
file = "crates/al-core/src/resolution.rs"
reason = "Stats-only accuracy issue. Fixing requires either a raw get (no stats) on the primary key or a dedicated two-key lookup API on SemanticCache. Defer until stats are used for more than dashboarding."
description = """
The subtype fallback pattern used in 3 places in resolution.rs:
    cache.get_type(&receiver.type_name)
         .or_else(|| receiver.type_subtype.as_deref().and_then(|s| cache.get_type(s)))
inflates the miss counter: when type_name misses but type_subtype hits (a successful
resolution), get_type records 1 miss then 1 hit. The daemon status stats would show
one miss per successful subtype-based resolution, making the hit rate appear lower
than actual cache effectiveness. Also when both miss, 2 misses are recorded for one
failed lookup.
"""

[[issues]]
id = "deferred-insight-nodekey-package-collision"
title = "NodeKey collisions when two packages define objects with the same name"
type = "deferred"
reporter = "adversarial"
date = ""
category = "constraint"
severity = "bug"
priority = "MEDIUM"
status = "open"
blocking_task = "T902-or-T903"
file = "crates/al-core/src/insight/graph.rs"
reason = "Requires architectural change to InsightGraph lookup — need multi-valued node lookup and subscriber resolution strategy that accounts for ambiguous targets across packages."
description = """
NodeKey::Object/Procedure/Event/Subscriber use (kind, name) without package.
Two different packages that both define e.g. Codeunit 'Sales-Post' with the same
method names will collide in the HashMap: ensure_node() returns the first one and
the second object's methods get edges into the wrong node. This is a design issue:
adding package to NodeKey would break subscriber resolution (subscribers reference
by name only, not by package), so a multi-valued lookup structure is needed instead
of the current 1:1 HashMap<NodeKey, NodeIndex>.
"""

