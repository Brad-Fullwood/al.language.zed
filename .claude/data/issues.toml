[[issues]]
id = "ISSUE-031"
title = "UTF-16/byte offset confusion across al-syntax (ts_range_to_lsp, context.rs prefix slice)"
type = "architecture"
reporter = "prod-readiness audit"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
status = "open"
triage = "STOP"
description = """
Related to ISSUE-024 but in al-syntax, affecting different code paths:

1. al-syntax/src/lib.rs:27-38 — ts_range_to_lsp converts tree-sitter column (byte offset
   within line) directly to LSP character (should be UTF-16 code units). Every LSP range
   returned by al-syntax (hover, diagnostics, folding, symbols) has incorrect character
   positions for non-ASCII content.

2. al-syntax/src/context.rs:34 — `&line[..col]` slices a &str with `position.character as
   usize` which is a UTF-16 code unit index. This PANICS on non-ASCII content because the
   byte index may not be a char boundary. Affects completion context extraction.

Root cause: no centralized UTF-16 ↔ byte offset conversion utility shared across crates.
al-core/src/resolution.rs has a correct utf16_col_to_byte_offset() but it's not reused.
"""

