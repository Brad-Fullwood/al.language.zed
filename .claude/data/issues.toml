title = "Two AppDependency types with field-for-field conversion in al-lsp"
type = "architecture"
reporter = "architecture audit"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "MEDIUM"
status = "fixed"
triage = "SCHEDULE"
description = """
al-core/src/project.rs defines AppDependency { id, name, publisher, version }.
al-symbols/src/nuget.rs defines AppDependency { id, name, publisher, version } — identical
fields, different type. al-core/src/lib.rs re-exports al_symbols::AppDependency as
crate::symbols::AppDependency alongside crate::project::AppDependency.

al-lsp/src/workspace.rs:286-294 and al-lsp/src/daemon.rs:1536-1542 both have explicit
field-by-field struct conversion: al_core::symbols::nuget::AppDependency { id: d.id.clone(),
name: d.name.clone(), ... }. Similarly for NuGetFeed (al-core::project::NuGetFeed has an
extra `name` field compared to al-symbols::nuget::NuGetFeed, but both are converted manually).

Root cause: project.rs was created when al-protocol was eliminated (ISSUE-014/021) to hold
domain types locally. al-symbols already had AppDependency for NuGet download use. Both
ended up with the same struct.

Fix direction: Use al-symbols::AppDependency as the canonical type throughout al-core,
removing the duplicate in project.rs. The NuGet download functions in al-core should accept
al-symbols::AppDependency directly rather than converting from the project type.

Resolution: al-symbols::nuget::AppDependency got Serialize/Deserialize derives and
#[serde(rename_all = "camelCase")] to match the app.json format. al-core::project::AppDependency
was replaced with `pub use al_symbols::nuget::AppDependency` (crates/al-core/src/project.rs).
Field-for-field conversions in workspace.rs and daemon.rs were eliminated — the types are
now identical. NuGetFeed is NOT unified (al-core::project::NuGetFeed has an extra `name`
field serving a different purpose — that conversion remains and is justified). Also fixed
pre-existing WIP bugs found while compiling: al-symbols/index.rs all_entries() method,
al-symbols/source_index.rs find_zip_offset visibility, al-symbols/virtual_file.rs duplicate
import. Verified: cargo check --workspace --exclude zed-al passes, 33/34 tests pass
(1 pre-existing failure in cli_fix_dry_run_json_has_structure).
"""

