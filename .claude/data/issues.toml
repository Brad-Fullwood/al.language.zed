[[issues]]
id = "ISSUE-018"
title = "al-diag feature gate incomplete in al-lsp daemon.rs"
type = "infra"
reporter = "architecture audit"
date = "2026-03-15"
category = "rule"
severity = "bug"
priority = "HIGH"
status = "fixed"
triage = "SCHEDULE"
description = """
al-diag is declared `optional = true` in al-lsp's Cargo.toml, gated by the `diagnostics`
feature (default-on). `main.rs:101` correctly uses `#[cfg(feature = "diagnostics")]` for
`DiagLayer::new()`. However, `daemon.rs:1436-1511` (`dispatch_diag()`) calls
