reporter = "supervisor"
date = "2026-03-14"
category = "constraint"
severity = "bug"
priority = "HIGH"
status = "fixed"
triage = "PARALLEL"
description = """
Architecture rule requires thin adapters (al-cli, al-explorer, al-mcp) to have zero compile-time
dependency on al-core, al-syntax, al-symbols, or al-semantic. al-cli/Cargo.toml has `al-syntax`,
`al-symbols`, `al-semantic`, and `al-discovery` as direct dependencies. al-explorer has
`al-symbols`. These violate the architecture mandate. al-cli should talk to al-lsp via
JSON-RPC only.

Fixed: The issue description was based on stale information. al-cli/Cargo.toml currently has
ONLY al-protocol as an al-* dependency — it is already a correct thin adapter. al-explorer
has al-protocol and al-symbols (intentional: standalone TUI). al-mcp has zero al-* deps
(shells out to `al` binary). Docs updated to reflect actual reality.
"""

