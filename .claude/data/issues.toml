title = "al-explorer dead files (client.rs, views.rs) and unnecessary tokio dependency"
type = "architecture"
reporter = "prod-readiness audit"
date = "2026-03-16"
category = "constraint"
severity = "drift"
priority = "LOW"
status = "fixed"
triage = "PARALLEL"
description = """
crates/al-explorer/src/:
- client.rs and views.rs existed as module files but were not declared as modules in main.rs
  (not referenced via `mod client;` or `mod views;`) — dead files accumulating in the source tree.
- main.rs used #[tokio::main] and `async fn main()` but contained no .await calls —
  tokio was an unnecessary heavy dependency for a synchronous TUI.

Fixed: Deleted client.rs and views.rs. Removed #[tokio::main] attribute and changed
`async fn main()` to `fn main()`. Removed tokio dependency from Cargo.toml.
"""

