resolution = """
Changed AlServer.workspace from Workspace to Arc<Workspace> so it can be cheaply cloned into spawned
tasks. Added init_task: Mutex<Option<JoinHandle<()>>> field. initialized() now clones Arc<Workspace>
and Client, spawns a tokio task that calls workspace::initialize_workspace(ws, client, root_uri), and
stores the handle so shutdown() can abort it. initialize_workspace() signature updated to take
(Arc<Workspace>, Client, Option<Url>) — removed dependency on &AlServer. Signals readiness via
log_message("AL workspace: ready"). al.reindex command updated to match new signature.
"""
description = """
crates/al-lsp/src/server.rs:341-350 — the initialized notification handler runs
workspace::initialize_workspace synchronously. This does NuGet downloads, package loading,
and bridge initialization. Per LSP spec, notification handlers should respond promptly.
A slow initialized handler can cause clients to time out waiting for the server to become
responsive.

Fix: spawn workspace initialization into a background task, signal readiness via
a progress notification.
"""

