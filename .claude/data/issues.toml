description = """
definition.rs, references.rs, rename.rs, impact.rs, permissions.rs, inlay_hints.rs, signature.rs,
and resolution.rs all call AlParser::parse_quick directly on workspace files, bypassing the
document store cache. This causes redundant re-parsing on every query. Fix: use
crate::parsing::get_or_parse via a synthesized Url::from_file_path.
