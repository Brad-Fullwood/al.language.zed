date = "2026-03-16"
category = "efficiency"
severity = "warning"
priority = "HIGH"
status = "fixed"
triage = "SERIAL"
resolution = """
Added FileIndex::file_trees (DashMap<PathBuf, Tree>) populated at add_file_with_meta time.
Added FileIndex::get_cached_parse(&path) -> Option<(String, Tree)> to read it.
Replaced AlParser::parse_quick calls in cross-file loops in:
- queries/definition.rs: both workspace-file loops now use get_cached_parse
- queries/references.rs: cross-file loop uses get_cached_parse
- queries/rename.rs: cross-file loop uses get_cached_parse
- queries/inlay_hints.rs: lookup_via_receiver uses get_cached_parse
- queries/signature.rs: resolve_receiver_signature uses get_cached_parse
