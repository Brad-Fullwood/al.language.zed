[[issues]]
id = "ISSUE-021"
title = "Analysis libs depend on al-protocol, bypassing one-code-path architecture"
type = "architecture"
reporter = "user"
date = "2026-03-15"
category = "constraint"
severity = "bug"
priority = "CRITICAL"
status = "open"
triage = "STOP"
description = """
al-symbols, al-semantic, and al-dap-client all have compile-time dependencies on al-protocol
to access domain types (AlToolchain, AppDependency, BcServerConfig, launch config). This
violates the one-code-path architecture: analysis libs should be standalone and protocol-
unaware. Domain types should either live in the analysis lib that owns them (e.g.,
AppDependency in al-symbols) or be passed in by al-core as function parameters.

Current violations:
- al-symbols/src/bc_server.rs: imports al_protocol::{launch::BcServerConfig, AppDependency}
- al-semantic/src/protocol.rs: imports al_protocol::jsonrpc (entire RPC layer)
- al-semantic/src/lib.rs: imports al_protocol::AlToolchain
- al-dap-client/src/session.rs: imports al_protocol::{launch, AlToolchain}
- al-dap-client/src/editor_services.rs: imports al_protocol::AlToolchain

Fix: Move domain types out of al-protocol into owning crates. al-protocol keeps only
JSON-RPC Request/Response/RpcError types. Related to ISSUE-014 (al-protocol has logic).

Hookify rules updated to block future al_protocol imports in all analysis libs.
"""

