[[issues]]
id = "deferred-semantic-cache-subtype-stat-inflation"
title = "Subtype fallback pattern inflates cache miss counter in resolution.rs"
type = "deferred"
reporter = "adversarial"
date = ""
category = "rule"
severity = "bug"
priority = "LOW"
status = "fixed"
blocking_task = "T703-followup"
file = "crates/al-core/src/resolution.rs"
reason = "Fixed: SemanticCache now has get_type_with_fallback() that records exactly one hit/miss for the whole operation. All 3 call sites in resolution.rs updated."
description = """
The subtype fallback pattern used in 3 places in resolution.rs:
    cache.get_type(&receiver.type_name)
         .or_else(|| receiver.type_subtype.as_deref().and_then(|s| cache.get_type(s)))
inflates the miss counter: when type_name misses but type_subtype hits (a successful
resolution), get_type records 1 miss then 1 hit. The daemon status stats would show
one miss per successful subtype-based resolution, making the hit rate appear lower
than actual cache effectiveness. Also when both miss, 2 misses are recorded for one
failed lookup.
"""

