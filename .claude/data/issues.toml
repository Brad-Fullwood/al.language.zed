[[issues]]
id = "ISSUE-052"
title = "BcServerConfig and DapLaunchConfig are identical types in different crates"
type = "architecture"
reporter = "architecture audit"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "HIGH"
status = "fixed"
triage = "SCHEDULE"
description = """
al-core/src/launch.rs and al-dap-client/src/config.rs both define the same types and
functions with different names but identical contents:

- al-core::launch::BcServerConfig == al-dap-client::config::DapLaunchConfig (same fields)
- al-core::launch::EnvironmentType == al-dap-client::config::EnvironmentType (same variants)
- al-core::launch::AuthMethod == al-dap-client::config::AuthMethod (same variants)
- al-core::launch::find_launch_config() == al-dap-client::config::find_launch_config()
  (same implementation, same file paths searched)
- al-symbols::bc_server::AuthMethod is a third identical copy of AuthMethod

Each crate has its own parse_auth_method() helper as well. The duplication requires manual
match/convert code in al-lsp/src/workspace.rs:231-233 and daemon.rs:1510-1512 every time
config is passed from the core layer to the DAP layer.

Root cause: types were defined independently when al-dap-client was made standalone (to
satisfy code-boundary rules). The canonical home for BC launch config is al-core since it
handles project discovery. al-dap-client should accept al-core::launch types directly.

Fix direction: Have al-dap-client accept al-core::launch::{BcServerConfig, EnvironmentType,
AuthMethod} directly, removing the type aliases in config.rs. al-symbols::bc_server::AuthMethod
should be replaced by al-core::launch::AuthMethod. This requires al-dap-client to depend on
al-core — which violates code-boundaries. Alternative: move the shared types to a new
minimal crate (al-bc-config or similar) that both al-core and al-dap-client can import.

Resolution: al-core::launch now re-exports EnvironmentType and AuthMethod from
al-dap-client::config (crates/al-core/src/launch.rs). The local enum definitions were
removed. BcServerConfig remains in al-core (it has core-specific methods dev_packages_url
and display_name). al-symbols::bc_server::AuthMethod stays separate as al-symbols cannot
import al-dap-client (boundary rule), but the al-core/al-dap-client duplication is
eliminated — one fewer copy. Verified: cargo check --workspace --exclude zed-al passes.
"""

