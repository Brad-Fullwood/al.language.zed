resolution = """
Changed InsightGraph.index from HashMap<NodeKey, NodeIndex> to HashMap<NodeKey, Vec<NodeIndex>>.
Updated ensure_node() to append new nodes when the key already exists (cross-package isolation).
Added get_nodes() returning &[NodeIndex] for multi-match lookups.
Updated resolve_relationships() subscriber loop to use get_nodes() and connect to ALL matching
event nodes across packages, breaking after the first kind that has matches.
