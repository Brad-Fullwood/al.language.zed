[[issues]]
id = "ISSUE-029"
title = "Daemon has no connection limit or accept-error backoff"
type = "architecture"
reporter = "prod-readiness audit"
date = "2026-03-16"
category = "constraint"
severity = "bug"
priority = "MEDIUM"
status = "fixed"
triage = "SCHEDULE"
resolution = """
Four fixes applied to crates/al-lsp/src/daemon.rs:
1. Accept error backoff: exponential backoff starting at 10ms, doubling each error, capped at
   5s; resets to 10ms on success. Prevents CPU spin on persistent EMFILE errors.
2. Connection semaphore: Arc<Semaphore> with MAX_CONNECTIONS=64. New connections are dropped
   (not queued) when at the limit. Permit held for lifetime of connection task via _permit.
3. dispatch_compile made async: replaced block_in_place + Handle::current().block_on() with
   direct async fn and .await. Eliminates the single-thread runtime panic risk.
4. Debug session: replaced spawn_blocking + Runtime::new() (nested runtime) with
   spawn_blocking + Handle::current().block_on() (reuses existing runtime).
Also fixed a pre-existing bug: nuget_deps[i].name in the Err branch of dispatch_download_symbols
was referencing a removed variable; corrected to all_deps[i].name.
"""
description = """
crates/al-lsp/src/daemon.rs:
- Lines 135-137: accept errors are logged but the loop continues without backoff.
  A persistent error (EMFILE) will spin at full CPU.
- No connection limit: unlimited concurrent connections can be spawned. A buggy client
  repeatedly opening connections could exhaust memory or file descriptors.
- Lines 1206-1233: block_in_place panics on single-thread runtime.
- Lines 1705-1713: spawn_blocking + Runtime::new() creates nested runtimes per debug launch.
"""

