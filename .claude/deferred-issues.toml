[[issue]]
id = "T402-doctor-blocks-tokio-worker"
task = "T402"
description = """
doctor() in al-core/src/toolchain.rs spawns a `dotnet --version` subprocess
synchronously inside dispatch_setup(), which is called from a tokio task in
daemon.rs. This blocks a tokio worker thread for the duration of the subprocess.
Should use tokio::task::spawn_blocking or tokio::process::Command.
"""
file = "crates/al-core/src/toolchain.rs:133"
deferred_to = "T610"
reason = "Requires making dispatch_setup async or using spawn_blocking wrapper — small but requires daemon.rs refactor."
