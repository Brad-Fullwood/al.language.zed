# Constraints Index
# References hookify rules and project rules that enforce architecture boundaries.
# This file is declarative — no executable code.

[architecture]
description = "Crate dependency direction and layer isolation"
enforced_by = ["hookify.block-adapter-cargo-deps", "hookify.block-adapter-rs-imports", "hookify.block-core-boundaries", "hookify.block-leaf-crate-boundaries"]
context = [".claude/rules/architecture.md", ".claude/rules/code-boundaries.md", ".claude/rules/thin-adapters.md"]

[analysis-libs]
description = "al-syntax, al-symbols, al-semantic, al-diag are standalone — no upward deps"
enforced_by = ["hookify.block-syntax-boundaries", "hookify.block-symbols-boundaries", "hookify.block-semantic-boundaries"]
context = [".claude/rules/code-boundaries.md"]

[testing]
description = "Tests must run and pass before task completion"
enforced_by = ["hookify.require-cargo-test-before-stop", "hookify.require-cargo-check-before-stop"]
context = [".claude/rules/testing.md"]

[code-quality]
description = "No bare Ok(()) — always propagate meaningful results"
enforced_by = ["hookify.block-bare-ok"]
context = []
