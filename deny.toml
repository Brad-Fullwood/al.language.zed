[graph]
targets = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # MPL-2.0 is file-level (weak) copyleft: using such a crate as an unmodified
  # dependency imposes no licensing obligations on our own source. Required by
  # `option-ext` (transitive via `directories`/`dirs`). cargo-deny flags it as
  # not-allowed otherwise.
  "MPL-2.0",
]
