[graph]
targets = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[advisories]
# keyring 3's Secret Service store (al-symbols, `nuget` feature) runs on zbus 4,
# which depends on the standalone zbus_names, zvariant and zvariant_derive
# crates. zbus 6 merged them in, and these advisories mark the standalone
# crates unmaintained. They report no vulnerability. The newest keyring stores
# still use zbus 5, which depends on the same crates.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, no zbus 6 keyring store yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, no zbus 6 keyring store yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, no zbus 6 keyring store yet" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Zero-clause BSD is OSI-approved and imposes fewer conditions than the
  # already-allowed BSD variants. Required by `interprocess` helper crates.
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # MPL-2.0 is file-level (weak) copyleft: using such a crate as an unmodified
  # dependency imposes no licensing obligations on our own source. Required by
  # `option-ext` (transitive via `directories`/`dirs`). cargo-deny flags it as
  # not-allowed otherwise.
  "MPL-2.0",
  # CDLA-Permissive-2.0 is a permissive (BSD-like) license covering the bundled
  # Mozilla root-certificate data in `webpki-roots` (pulled in by the rustls TLS
  # stack). No copyleft / source obligations on our code.
  "CDLA-Permissive-2.0",
]
