[graph]
targets = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[advisories]
# Keep this empty as policy: fix advisories by upgrading, not ignoring
# (SYSTEM_REVIEW_ACTION_PLAN F11). The previous RUSTSEC-2017-0008 (`serial`)
# entry became stale when portable-pty 0.9 dropped the dep — cargo-deny now
# warns advisory-not-detected for it.
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # MPL-2.0 is file-level (weak) copyleft: using such a crate as an unmodified
  # dependency imposes no licensing obligations on our own source. Required by
  # `option-ext` (transitive via `directories`/`dirs`). cargo-deny flags it as
  # not-allowed otherwise.
  "MPL-2.0",
  # CDLA-Permissive-2.0 is a permissive (BSD-like) license covering the bundled
  # Mozilla root-certificate data in `webpki-roots` (pulled in by the rustls TLS
  # stack). No copyleft / source obligations on our code.
  "CDLA-Permissive-2.0",
]
